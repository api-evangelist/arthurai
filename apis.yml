aid: arthurai
name: ArthurAI
description: >-
  Arthur is an enterprise AI governance and observability platform — an "AI
  control plane" to detect, govern, and improve AI across an organization. It
  provides agent discovery across OTEL/MCP/network/cloud APIs, end-to-end
  agentic tracing and observability, LLM-as-a-judge evaluations, guardrail
  rules that validate prompts and responses, and organization-wide monitoring
  policies. Arthur exposes two public REST APIs: Arthur Scope (observability,
  connectors, datasets, metrics, alerts, and policy governance) authenticated
  with OAuth2, and the Arthur GenAI Engine (tasks, guardrail rules, prompt and
  response validation, inferences, and feedback) authenticated with a bearer
  API key. Deployable as SaaS, hybrid, or on-premises, with first-party Python
  SDKs and an official Claude Code onboarding skill.
