openapi: 3.1.0
info:
  title: Arthur GenAI Engine Agent Discovery LLMEvals API
  version: 2.1.688
tags:
- name: LLMEvals
paths:
  /api/v1/tasks/{task_id}/llm_evals/{eval_name}/versions/{eval_version}:
    get:
      tags:
      - LLMEvals
      summary: Get an llm eval
      description: Get an llm eval by name and version
      operationId: get_llm_eval_api_v1_tasks__task_id__llm_evals__eval_name__versions__eval_version__get
      security:
      - API Key: []
      parameters:
      - name: eval_name
        in: path
        required: true
        schema:
          type: string
          title: Eval Name
      - name: eval_version
        in: path
        required: true
        schema:
          type: string
          title: LLM Eval Version
          description: The version of the llm eval to retrieve. Can be 'latest', a version number (e.g. '1', '2', etc.), an ISO datetime string (e.g. '2025-01-01T00:00:00'), or a tag.
        description: The version of the llm eval to retrieve. Can be 'latest', a version number (e.g. '1', '2', etc.), an ISO datetime string (e.g. '2025-01-01T00:00:00'), or a tag.
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eval'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - LLMEvals
      summary: Delete an llm eval version
      description: Deletes a specific version of an llm eval
      operationId: soft_delete_llm_eval_version_api_v1_tasks__task_id__llm_evals__eval_name__versions__eval_version__delete
      security:
      - API Key: []
      parameters:
      - name: eval_name
        in: path
        required: true
        schema:
          type: string
          title: Eval Name
      - name: eval_version
        in: path
        required: true
        schema:
          type: string
          title: LLM Eval Version
          description: The version of the llm eval to delete. Can be 'latest', a version number (e.g. '1', '2', etc.), an ISO datetime string (e.g. '2025-01-01T00:00:00'), or a tag.
        description: The version of the llm eval to delete. Can be 'latest', a version number (e.g. '1', '2', etc.), an ISO datetime string (e.g. '2025-01-01T00:00:00'), or a tag.
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '204':
          description: LLM eval version deleted.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}/llm_evals/{eval_name}/versions:
    get:
      tags:
      - LLMEvals
      summary: List all versions of an llm eval
      description: List all versions of an llm eval with optional filtering.
      operationId: get_all_llm_eval_versions_api_v1_tasks__task_id__llm_evals__eval_name__versions_get
      security:
      - API Key: []
      parameters:
      - name: eval_name
        in: path
        required: true
        schema:
          type: string
          title: Eval Name
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaginationSortMethod'
          description: Sort the results (asc/desc)
          default: desc
        description: Sort the results (asc/desc)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Page size. Default is 10. Must be greater than 0 and less than 5000.
          default: 10
          title: Page Size
        description: Page size. Default is 10. Must be greater than 0 and less than 5000.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Page number
          default: 0
          title: Page
        description: Page number
      - name: model_provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by model provider (e.g., 'openai', 'anthropic', 'azure').
          title: Model Provider
        description: Filter by model provider (e.g., 'openai', 'anthropic', 'azure').
      - name: model_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by model name (e.g., 'gpt-4', 'claude-3-5-sonnet').
          title: Model Name
        description: Filter by model name (e.g., 'gpt-4', 'claude-3-5-sonnet').
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Inclusive start date for prompt creation in ISO8601 string format. Use local time (not UTC).
          title: Created After
        description: Inclusive start date for prompt creation in ISO8601 string format. Use local time (not UTC).
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exclusive end date for prompt creation in ISO8601 string format. Use local time (not UTC).
          title: Created Before
        description: Exclusive end date for prompt creation in ISO8601 string format. Use local time (not UTC).
      - name: exclude_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to exclude deleted prompt versions from the results. Default is False.
          default: false
          title: Exclude Deleted
        description: Whether to exclude deleted prompt versions from the results. Default is False.
      - name: min_version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Minimum version number to filter on (inclusive).
          title: Min Version
        description: Minimum version number to filter on (inclusive).
      - name: max_version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Maximum version number to filter on (inclusive).
          title: Max Version
        description: Maximum version number to filter on (inclusive).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMEvalsVersionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}/llm_evals:
    get:
      tags:
      - LLMEvals
      summary: Get all llm evals
      description: Get all llm evals for a given task with optional filtering.
      operationId: get_all_llm_evals_api_v1_tasks__task_id__llm_evals_get
      security:
      - API Key: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LLMMetadataSortField'
          description: Field to sort the metadata list by. 'name' (default) preserves the historical alphabetical ordering. 'latest_version_created_at' orders by the most recent version's creation timestamp so that pagination matches the 'last updated' display.
          default: name
        description: Field to sort the metadata list by. 'name' (default) preserves the historical alphabetical ordering. 'latest_version_created_at' orders by the most recent version's creation timestamp so that pagination matches the 'last updated' display.
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaginationSortMethod'
          description: Sort the results (asc/desc)
          default: desc
        description: Sort the results (asc/desc)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Page size. Default is 10. Must be greater than 0 and less than 5000.
          default: 10
          title: Page Size
        description: Page size. Default is 10. Must be greater than 0 and less than 5000.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Page number
          default: 0
          title: Page
        description: Page number
      - name: llm_asset_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: LLM asset names to filter on using partial matching. If provided, llm assets matching any of these name patterns will be returned
          title: Llm Asset Names
        description: LLM asset names to filter on using partial matching. If provided, llm assets matching any of these name patterns will be returned
      - name: model_provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by model provider (e.g., 'openai', 'anthropic', 'azure').
          title: Model Provider
        description: Filter by model provider (e.g., 'openai', 'anthropic', 'azure').
      - name: model_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by model name (e.g., 'gpt-4', 'claude-3-5-sonnet').
          title: Model Name
        description: Filter by model name (e.g., 'gpt-4', 'claude-3-5-sonnet').
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Inclusive start date for prompt creation in ISO8601 string format. Use local time (not UTC).
          title: Created After
        description: Inclusive start date for prompt creation in ISO8601 string format. Use local time (not UTC).
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exclusive end date for prompt creation in ISO8601 string format. Use local time (not UTC).
          title: Created Before
        description: Exclusive end date for prompt creation in ISO8601 string format. Use local time (not UTC).
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of tags to filter for items that have any matching tag across any version.
          title: Tags
        description: List of tags to filter for items that have any matching tag across any version.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMGetAllMetadataListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}/llm_evals/{eval_name}/versions/{eval_version}/completions:
    post:
      tags:
      - LLMEvals
      summary: Run a saved llm eval
      description: Run a saved llm eval
      operationId: run_saved_llm_eval_api_v1_tasks__task_id__llm_evals__eval_name__versions__eval_version__completions_post
      security:
      - API Key: []
      parameters:
      - name: eval_name
        in: path
        required: true
        schema:
          type: string
          title: Eval Name
      - name: eval_version
        in: path
        required: true
        schema:
          type: string
          title: LLM Eval Version
          description: The version of the llm eval to run. Can be 'latest', a version number (e.g. '1', '2', etc.), an ISO datetime string (e.g. '2025-01-01T00:00:00'), or a tag.
        description: The version of the llm eval to run. Can be 'latest', a version number (e.g. '1', '2', etc.), an ISO datetime string (e.g. '2025-01-01T00:00:00'), or a tag.
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCompletionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}/llm_evals/{eval_name}:
    post:
      tags:
      - LLMEvals
      summary: Save an llm eval
      description: Save an llm eval to the database
      operationId: save_llm_eval_api_v1_tasks__task_id__llm_evals__eval_name__post
      security:
      - API Key: []
      parameters:
      - name: eval_name
        in: path
        required: true
        schema:
          type: string
          title: Eval Name
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eval'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - LLMEvals
      summary: Delete an llm eval
      description: Deletes an entire llm eval
      operationId: delete_llm_eval_api_v1_tasks__task_id__llm_evals__eval_name__delete
      security:
      - API Key: []
      parameters:
      - name: eval_name
        in: path
        required: true
        schema:
          type: string
          title: Eval Name
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '204':
          description: LLM eval deleted.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}/llm_evals/{eval_name}/versions/tags/{tag}:
    get:
      tags:
