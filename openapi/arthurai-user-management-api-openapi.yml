openapi: 3.1.0
info:
  title: Arthur GenAI Engine Agent Discovery User Management API
  version: 2.1.688
tags:
- name: User Management
paths:
  /users/me:
    get:
      tags:
      - User Management
      summary: Get Me
      description: Returns the current caller's identity, roles, org_scope, and (when scoped) the organization record. Used by the UI on login to decide between admin and tenant render branches. Admin callers and JWT callers receive org_scope=null and org=null.
      operationId: get_me_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      security:
      - API Key: []
components:
  schemas:
    MeResponse:
      properties:
        user_id:
          type: string
          title: User Id
        roles:
          items:
            type: string
          type: array
          title: Roles
        org_scope:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Scope
        org:
          anyOf:
          - $ref: '#/components/schemas/OrganizationResponse'
          - type: 'null'
      type: object
      required:
      - user_id
      - roles
      title: MeResponse
    OrganizationResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: OrganizationResponse
  securitySchemes:
    API Key:
      type: http
      description: Bearer token authentication with an API key
      scheme: bearer
