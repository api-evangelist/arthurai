openapi: 3.2.0
info:
  title: Arthur Scope Upsolve V1 API
  version: 0.1.0
tags:
- name: Upsolve V1
paths:
  /api/v1/upsolve-ai/tenant/token:
    post:
      tags:
      - Upsolve V1
      summary: Retrieve Jwt For Upsolve Ai Dashboards
      description: Authenticates and authorizes user with Upsolve AI and returns Upsolve JWT.
      operationId: post_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpsolveTenant'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsolveToken'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCode: []
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    InternalServerError:
      properties:
        detail:
          type: string
          title: Detail
          default: Internal server error
      type: object
      title: InternalServerError
    UpsolveToken:
      properties:
        token:
          type: string
          title: Token
          description: JWT for use with Upsolve API.
        application_count:
          type: integer
          title: Application Count
          description: Number of applications included in this token's prefilters.
        total_application_count:
          type: integer
          title: Total Application Count
          description: Total applications the caller can access in this scope, before the ARTHUR_UPSOLVE_MAX_DASHBOARD_APPLICATIONS cap is applied. Greater than application_count when the dashboard is showing a truncated view.
      type: object
      required:
      - token
      - application_count
      - total_application_count
      title: UpsolveToken
    NotFoundError:
      properties:
        detail:
          type: string
          title: Detail
          default: Resource not found
      type: object
      title: NotFoundError
    PostUpsolveTenant:
      properties:
        resource_kind:
          $ref: '#/components/schemas/ResourceKind'
          description: Kind of the resource the user wants a JWT to access data for in Upsolve. Supports model, project, workspace, and policy resource kinds.
        resource_id:
          type: string
          format: uuid
          title: Resource Id
          description: ID of the resource.
        prefilter_project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Prefilter Project Id
          description: 'Narrow the token''s data to a single project inside the workspace, without changing which Upsolve tenant the token belongs to. Only valid when resource_kind is workspace, and the project must belong to that workspace. Use this for a project view of a workspace-owned dashboard: the tenant identity (and therefore the saved dashboard customizations) stays with the workspace while the applications embedded in the token are just the project''s, so the ARTHUR_UPSOLVE_MAX_DASHBOARD_APPLICATIONS cap applies per project rather than across the whole workspace.'
      type: object
      required:
      - resource_kind
      - resource_id
      title: PostUpsolveTenant
    ResourceKind:
      type: string
      enum:
      - platform
      - organization
      - workspace
      - project
      - model
      - connector
      - available_dataset
      - dataset
      - role_binding
      - role
      - user
      - group
      - data_plane_association
      - data_plane
      - alert_rule
      - webhook
      - custom_aggregation
      - custom_aggregation_test
      - agent
      - policy
      - policy_alert_rule
      - policy_attestation_rule
      - policy_assignment
      - dashboard
      - discovery_source
      - discovery_source_config
      title: ResourceKind
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    OAuth2AuthorizationCode:
      type: oauth2
      flows:
        authorizationCode:
          refreshUrl: https://platform-auth.arthur.ai/realms/arthur/protocol/openid-connect/token
          scopes: {}
          authorizationUrl: https://platform-auth.arthur.ai/realms/arthur/protocol/openid-connect/auth
          tokenUrl: https://platform-auth.arthur.ai/realms/arthur/protocol/openid-connect/token
x-provenance:
  method: harvested
  publisher: ArthurAI
  source: https://platform.arthur.ai/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
