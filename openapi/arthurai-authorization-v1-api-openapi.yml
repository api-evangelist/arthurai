        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCode: []
components:
  schemas:
    InternalServerError:
      properties:
        detail:
          type: string
          title: Detail
          default: Internal server error
      type: object
      title: InternalServerError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Permission:
      properties:
        name:
          $ref: '#/components/schemas/PermissionName'
          description: Name of permission. Must be unique.
        description:
          type: string
          title: Description
          description: Description of the permission.
        resource_kind:
          $ref: '#/components/schemas/ResourceKind'
          description: Kind of the resource the permission references.
      type: object
      required:
      - name
      - description
      - resource_kind
      title: Permission
    BoundMember:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Id of the bound member.
        name:
          type: string
          title: Name
          description: Name of the bound member.
      type: object
      required:
      - id
      - name
      title: BoundMember
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    BoundMemberKind:
      type: string
      enum:
      - user
      - group
      title: BoundMemberKind
    BoundResource:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the bound resource.
        name:
          type: string
          title: Name
          description: Name of the bound resource.
        metadata:
          anyOf:
          - $ref: '#/components/schemas/ProjectBoundResourceMetadata'
          - type: 'null'
          description: Metadata specific to the type of the bound resource.
      type: object
      required:
      - id
      - name
      title: BoundResource
    BadRequestError:
      properties:
        detail:
          type: string
          title: Detail
