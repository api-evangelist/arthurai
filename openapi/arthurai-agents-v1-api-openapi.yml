          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    RuleScope:
      type: string
      enum:
      - default
      - task
      title: RuleScope
    UnregisteredAgentEngine:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the engine.
        name:
          type: string
          title: Name
          description: Name of the engine.
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: ID of the engine's workspace.
        workspace_name:
          type: string
          title: Workspace Name
          description: Name of the engine's workspace.
        infrastructure:
          $ref: '#/components/schemas/Infrastructure'
          description: Infrastructure where the engine is running (e.g., AWS, GCP, Azure, Docker, Kubernetes).
      type: object
      required:
      - id
      - name
      - workspace_id
      - workspace_name
      - infrastructure
      title: UnregisteredAgentEngine
    Detection:
      type: string
      enum:
      - observed
      - inferred
      title: Detection
      description: 'How a source came to know the agent is there.


        NOT RANKABLE AGAINST VISIBILITY, which is why they are two fields. An earlier

        single band ordered "traced, inferred, thin" strongest to weakest, which put an

        osquery-confirmed binary on disk *below* a name lifted from a log field --

        inverted, because it was sorting two different questions on one scale.'
    Infrastructure:
      type: string
      enum:
      - AWS
      - Azure
      - GCP
      - Docker
      - Kubernetes
      title: Infrastructure
    RegisterUnregisteredAgentRequest:
      properties:
        project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
          description: Project to create the application in. Absent, the workspace's "Registered Applications" project is used, and created if it does not exist.
        name:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Name
          description: Name for the application. Absent, the agent's task name.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description for the application.
      type: object
      title: RegisterUnregisteredAgentRequest
      description: 'Register an unregistered agent as an application, in one call.


        The Platform finds or creates the project, associates the agent''s engine with

        it, and submits the job that creates the application from the agent''s task; the

        agent is bound to the application when it arrives. Poll the returned

        registration for the outcome.'
    LLMModel:
      properties:
        name:
          type: string
          title: Name
          description: Name of the model.
      type: object
      required:
      - name
      title: LLMModel
      description: Model used by an agent.
    RunsOn:
      type: string
      enum:
      - aws
      - azure
      - gcp
      - endpoint
      - unknown
      title: RunsOn
      description: 'Where the machine hosting a discovered agent is. ONE AXIS: location.


        Lives on Provenance rather than being derived from the source type: a Jamf record

        runs on a laptop, not on the cloud hosting the engine that reported it.


        Deliberately NOT a place for `docker` or `kubernetes`. Those answer a different

        question -- how the agent is packaged on the machine -- and mixing the two makes

        the common case lossy: an agent in an EKS pod is both `aws` and orchestrated, and

        one field can only say one. They are also values nothing can currently fill. In the

        endpoint collector Docker is a detection ROUTE (`docker_images`, surfaced as

        ``resource_kind=image``), and in app_plane `Infrastructure.Docker` describes how

        the ENGINE was deployed. Neither is a statement about where a discovered agent

        runs. If the packaging axis starts mattering, it wants its own field.


        ``on_prem`` is the natural next member on this axis and is left out only because

        nothing in v1 can fill it: on-prem records arrive through a SIEM, which cannot see

        the machine, so UNKNOWN is already the honest answer there.'
    CoverageClass:
      type: string
      enum:
      - otel
      - cloud
      - siem
      - endpoint
      - network_gateway
      title: CoverageClass
      description: 'A card on the coverage grid.


        The source classes agents are observed from, minus `manual`, plus Network &

        Gateway: a class no source can report today, listed so the gap is named rather

        than left out.'
    ResourceList_AgentResponse_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/AgentResponse'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[AgentResponse]
    ExampleConfig:
      properties:
        example:
          type: string
          title: Example
          description: Custom example for the sensitive data
        result:
          type: boolean
          title: Result
          description: 'Boolean value representing if the example passes or fails the the sensitive data rule '
      type: object
      required:
      - example
      - result
      title: ExampleConfig
      example:
        example: John has O negative blood group
        result: true
    ResourceList_UnregisteredAgentEngine_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/UnregisteredAgentEngine'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[UnregisteredAgentEngine]
    DataSourceResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the data source entry.
        url:
          type: string
          title: Url
          description: URL of the data source.
      type: object
      required:
      - id
      - url
      title: DataSourceResponse
      description: Response model for a data source with assigned ID.
    UnregisteredAgentActionResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the action.
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace the action was taken in.
        action:
          $ref: '#/components/schemas/UnregisteredAgentAction'
          description: Mute or unmute.
        actor_user_id:
          type: string
          format: uuid
          title: Actor User Id
          description: The user who took the action.
        performed_at:
          type: string
          format: date-time
          title: Performed At
          description: When the action ran.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why: the mute reason, or the optional unmute reason.'
        muted_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Muted Until
          description: For a mute, the timestamp the agents are muted until.
        filters:
          anyOf:
          - $ref: '#/components/schemas/UnregisteredAgentFilter'
          - type: 'null'
          description: The filter the action was given, as given. Null when the action named agents by id.
        agent_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Agent Ids
          description: The agents the action changed, resolved when it ran. For a filter, this snapshot is what keeps the entry readable after the agents have moved on.
        affected_count:
          type: integer
          title: Affected Count
          description: How many agents the action changed.
      type: object
      required:
      - id
      - workspace_id
      - action
      - actor_user_id
      - performed_at
      - agent_ids
      - affected_count
      title: UnregisteredAgentActionResponse
      description: 'One mute or unmute, over one agent or many: the audit entry it left.'
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      title: SortOrder
    SourceAddress:
      properties:
        instance:
          type: string
          minLength: 1
          title: Instance
          description: 'Instance that was scanned: an account, project, SIEM workspace or device. Part of the address, so two instances of one vendor stay distinct.'
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
          description: 'Subdivision queried, where the source has one: a cloud region, a Splunk index, a Sentinel table, an Elastic data stream. Optional here because endpoints have no subdivision and a SIEM query may span every index, but required for CLOUD sources, which enforce it: there the region is part of the agent''s identity rather than of the query.'
        resource_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Kind
          description: 'Namespace `resource_id` lives in: a bundle id, npm package, launchd label, listening port, browser extension id. Identity rather than observation, and needed because ''8788'' and ''openclaw'' are otherwise indistinguishable strings from colliding namespaces. Absent for sources with one kind of resource, which is every cloud and SIEM vendor -- there the vendor implies the kind, so carrying it would duplicate `vendor`. Free text: the vocabulary belongs to the collector''s route registry, not to this schema.'
        resource_id:
          type: string
          minLength: 1
          title: Resource Id
          description: The resource within that instance, in the namespace `resource_kind` names. For endpoints this is the software, with the device in `instance` -- the grain is per (software, device).
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
          description: Query text that produced this record, so it can be explained and reproduced. Absent for sources that are enumerated rather than searched. Never parsed here -- only the output columns are contracted.
      type: object
      required:
      - instance
      - resource_id
      title: SourceAddress
      description: 'How to find a discovered agent again in the system that reported it.


        One shape for every source, widest to narrowest:


        ==============  ================  ==================  ==========  ============

        source          instance          scope               kind        resource_id

        ==============  ================  ==================  ==========  ============

        Bedrock         AWS account       region              --          agent id

        Vertex          GCP project       region              --          engine id

        Splunk          instance          index+sourcetype    --          record id

        Sentinel        LA workspace      table               --          record id

        Elastic         deployment        data stream         --          record id

        Jamf / osquery  device key        --                  npm, app…   software key

        ==============  ================  ==================  ==========  ============


        Only endpoints fill ``resource_kind``: they are the one source whose ids come from

        several namespaces at once. Every cloud and SIEM vendor addresses exactly one kind

        of resource, so the kind is implied by the vendor and stays absent.


        ``scope`` carries two readings this one name does not separate. For a cloud source

        it addresses the *agent*: us-east-1 and us-west-2 hold different agents, so

        ``CloudAgentCreationSource`` requires it. For a SIEM it addresses the *sighting*,

        and one agent may surface under two indexes, so it stays optional there. Code

        comparing addresses across sources has to read `source_class` to know which it is

        looking at.


        Reused by Provenance rather than re-declared there, so a record and the task it

        resolves to address the upstream system identically. A vendor needing to address a

        sub-resource -- a Bedrock alias, a Vertex version -- is one more optional field

        here, not a new shape.'
    AgentRegistrationResponse:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time of record creation.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Time of last record update.
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the registration.
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace of the agent.
        agent_id:
          type: string
          format: uuid
          title: Agent Id
          description: The agent being registered.
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: Project the application is created in.
        job_id:
          type: string
          format: uuid
          title: Job Id
          description: The job creating the application; its logs and errors say why a registration failed.
        status:
          $ref: '#/components/schemas/AgentRegistrationStatus'
          description: pending until the application exists and the agent is bound to it; then completed, or failed with `error` set.
        model_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Model Id
          description: The application the agent was registered to, once completed.
        requested_by_user_id:
          type: string
          format: uuid
          title: Requested By User Id
          description: Who asked for the registration.
        requested_at:
          type: string
          format: date-time
          title: Requested At
          description: When.
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: When the registration completed or failed.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why the registration failed, when it did.
      type: object
      required:
      - created_at
      - updated_at
      - id
      - workspace_id
      - agent_id
      - project_id
      - job_id
      - status
      - requested_by_user_id
      - requested_at
      title: AgentRegistrationResponse
      description: One request to register an agent, and how far it has got.
    AgentObservations:
      properties:
        install_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Install Path
          description: Install location, shaped to '~/...' rather than '/Users/<name>/...' so a username does not travel in a path.
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: Version read statically, never by executing the discovered binary.
        host_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Host Name
          description: Host the agent was observed on, e.g. 'MBP-4471'.
        host_group:
          anyOf:
          - type: string
          - type: 'null'
          title: Host Group
          description: 'Grouping the host belongs to: a Jamf site or smart group, a cloud resource group.'
        os_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Os Version
          description: Guest OS version, e.g. 'macOS 15.3 (24D60)'.
        assigned_user:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned User
          description: 'User the source attributes the host to. PERSONAL DATA: this is the field that makes a record attributable to an individual, and is subject to works-council and DPIA review before EU deployment. Omit it where that review has not happened.'
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: Capabilities the agent declared for itself, e.g. a browser extension's manifest permissions ('tabs', 'nativeMessaging', '<all_urls>'). A cloud agent's action groups or service-account scopes answer the same question, which is why this is shared rather than endpoint-only.
        service_names:
          items:
            type: string
          type: array
          title: Service Names
          description: Service names this agent emits telemetry under. What links a discovered agent to traces already arriving.
        classification:
          anyOf:
          - type: string
          - type: 'null'
          title: Classification
          description: Short catalog label shown beside the name, e.g. 'Personal agent'. Free text so the catalog can add one without a schema release. Absent for uncatalogued software, which must still render.
      type: object
      title: AgentObservations
      description: 'What a source could see about an agent. Shared across categories, all optional.


        An absent field means the source cannot see it, not that collection failed. That

        promise is kept by each source declaring ``observable_fields()``, which is also

        what lets visibility be computed without a per-vendor branch in consumers.'
    CoverageClassSummary:
      properties:
        coverage_class:
          $ref: '#/components/schemas/CoverageClass'
          description: The card.
        agents_discovered:
          type: integer
          title: Agents Discovered
          description: Unregistered agents in scope with any evidence of this class. An agent seen from two classes counts in both, so the classes can sum past total_discovered.
        agents_needing_triage:
          type: integer
          title: Agents Needing Triage
          description: Of those, the ones not currently muted.
        sources:
          anyOf:
          - items:
              $ref: '#/components/schemas/CoverageSourceSummary'
            type: array
          - type: 'null'
          title: Sources
          description: The organization's sources of this class, deleted ones left out. Null when the caller cannot list discovery sources; always empty for otel and network_gateway, which have no configurable sources.
      type: object
      required:
      - coverage_class
      - agents_discovered
      - agents_needing_triage
      - sources
      title: CoverageClassSummary
    EvidenceResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the evidence record.
        creation_source:
          $ref: '#/components/schemas/AgentCreationSource'
          description: The reporting source, its upstream address and what it observed.
        external_id:
          type: string
          title: External Id
          description: The source's own identifier for this agent, and the canonical identity for the record. Never re-derived or reconciled across sources.
        source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Id
          description: The Discovery Source behind this evidence. Absent for agents predating discovery, and retained after a source is deleted.
        detection:
          anyOf:
          - $ref: '#/components/schemas/Detection'
          - type: 'null'
          description: How this source knows the agent is there -- observed directly, or inferred from indirect evidence. Fixed by the source class. None for manual tasks, which are not records.
        visibility:
          $ref: '#/components/schemas/Visibility'
          description: How much of the agent this source can see. Computed server-side from which fields it could actually fill, never a UI heuristic.
        is_stale:
          type: boolean
          title: Is Stale
          description: 'Whether this source has gone quiet -- `last_scanned` is older than the freshness window for its discovery source. Derived on read rather than stored: a stored flag is wrong the moment time passes without a write. Independent of `detection` and `visibility`, so an expiring credential does not downgrade what the source was able to see.'
        last_seen:
          type: string
          format: date-time
          title: Last Seen
          description: When the evidence itself was observed.
        last_scanned:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Scanned
          description: When this source was last read successfully for this record. Separate from `last_seen` because they fail separately, and per-record because a fleet pull returns records of wildly differing freshness.
        first_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen
          description: 'The earliest time this source reported seeing the agent: the earliest `last_seen` it has reported, derived by the Platform as reports arrive and never moved forward. Per-source: a record can be new to a Splunk source and months old to the endpoint one.'
        discovered_in_run:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Discovered In Run
          description: 'The scan run that produced this evidence. Meant to be what ''new this scan'' derives from -- there is deliberately no ''new'' status field to fall out of date. `first_seen` cannot serve for it: it is the source''s own sighting, which can predate the scan that first reported the record.'
      type: object
      required:
      - id
      - creation_source
      - external_id
      - visibility
      - is_stale
      - last_seen
      title: EvidenceResponse
      description: 'One source''s report of one agent, as the API serves it.


        Declared standalone rather than as a subclass of `arthur_common`''s `Evidence`, and

        with `detection` as a plain field rather than the computed one it carries. The reason

        is FastAPI''s `separate_input_output_schemas`: a model with computed fields is emitted

        as a separate `-Input`/`-Output` pair, and a model nested inside another does not get

        the Output variant -- so every list endpoint''s generated client would have silently

        dropped the computed fields. The values are still derived rather than accepted; the

        derivation just moved into the translator, which is the one place that builds these.


        The three axes a record is graded on are separate fields on purpose. `detection`

        says how the agent was found, `visibility` how much of it can be seen, and

        `is_stale` whether the source is still reporting. Collapsing any pair loses

        something: an osquery-confirmed binary ranks below a name lifted from a log field on

        a single band, and a Traced record stops being Traced the moment its credential

        expires.'
    AgentCreationSource:
      oneOf:
      - $ref: '#/components/schemas/GCPAgentCreationSource-Input'
      - $ref: '#/components/schemas/OTELAgentCreationSource-Input'
      - $ref: '#/components/schemas/ManualAgentCreationSource-Input'
      - $ref: '#/components/schemas/CloudAgentCreationSource'
      - $ref: '#/components/schemas/SIEMAgentCreationSource'
      - $ref: '#/components/schemas/EndpointAgentCreationSource'
      title: AgentCreationSource
      discriminator:
        propertyName: type
        mapping:
          CLOUD: '#/components/schemas/CloudAgentCreationSource'
          ENDPOINT: '#/components/schemas/EndpointAgentCreationSource'
          GCP: '#/components/schemas/GCPAgentCreationSource-Input'
          MANUAL: '#/components/schemas/ManualAgentCreationSource-Input'
          OTEL: '#/components/schemas/OTELAgentCreationSource-Input'
          SIEM: '#/components/schemas/SIEMAgentCreationSource'
    ProvenanceSource:
      properties:
        source_class:
          $ref: '#/components/schemas/SourceClass'
          description: Where this contribution was observed from.
        source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Id
          description: The Discovery Source behind it. Absent for agents predating discovery, and retained after a source is deleted.
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
          description: Upstream product behind this contribution, e.g. 'splunk_enterprise'. Same value and same registry as the record's `vendor`. Absent for OTEL and manual agents, which have no upstream product.
        address:
          anyOf:
          - $ref: '#/components/schemas/SourceAddress'
          - type: 'null'
          description: Where upstream this came from -- the same type the creation source carries, so a record and its task address the system identically. Absent for OTEL and manual agents.
        last_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen
          description: 'When this source last observed the agent -- the discovered record''s own `last_seen`, not when a scan last reported it. Evidence recency rather than scan recency: a source can keep reporting an agent it has not actually seen for weeks. Only ever moves forward, so an out-of-order batch cannot make an agent look staler than it is. Absent for OTEL, manual and legacy GCP agents, which carry no discovery record.'
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
          description: The source's own identifier for the record behind this entry -- the record's `external_id`, canonical and never reconciled across sources. With `source_id` it names exactly one record, which is what a consumer keys that record's evidence on. Absent for OTEL, manual and legacy GCP agents, which carry no discovery record, and from producers that predate it.
        last_scanned:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Scanned
          description: 'When a scan of this source last reported the record: scan recency on the reporting engine''s clock, where `last_seen` is evidence recency on the source''s. The same fact as `Evidence.last_scanned`, which staleness is derived from. Absent for OTEL, manual and legacy GCP agents, and from producers that predate it.'
      type: object
      required:
      - source_class
      title: ProvenanceSource
      description: 'One source''s contribution to a task''s provenance.


        Provenance holds a list of these rather than scalars beside a list of source

        classes: with scalars, an agent corroborated by two sources has two entries in

        found_by but one address, and nothing says which source it belongs to.'
    CoverageBlindSpot:
      properties:
        coverage_class:
          $ref: '#/components/schemas/CoverageClass'
          description: The class with the gap.
        source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Id
          description: The source with the gap, for source_failed, not_yet_reported and source_stale; null for a gap in a whole class.
        reason:
          $ref: '#/components/schemas/BlindSpotReason'
          description: Why nothing is reporting.
        description:
          type: string
          title: Description
          description: The gap in words, for display.
      type: object
      required:
      - coverage_class
      - source_id
      - reason
      - description
      title: CoverageBlindSpot
    CoverageSourceSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the discovery source.
        name:
          type: string
          title: Name
          description: Name of the discovery source.
        vendor:
          type: string
          title: Vendor
          description: The source's vendor.
        display_name:
          type: string
          title: Display Name
          description: The vendor's display name.
        is_enabled:
          type: boolean
          title: Is Enabled
          description: False when the source is paused.
        health:
          $ref: '#/components/schemas/DiscoverySourceHealth'
          description: The source's health.
        health_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Health Details
          description: Why the source is in that state, in the vendor's own words.
        last_successful_run_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Successful Run At
          description: When a scan on this source last succeeded.
        consecutive_failures:
          type: integer
          title: Consecutive Failures
          description: Scans on this source that have failed in a row.
        agents_discovered:
          type: integer
          title: Agents Discovered
          description: Unregistered agents in scope with evidence from this source.
        agents_needing_triage:
          type: integer
          title: Agents Needing Triage
          description: Of those, the ones not currently muted.
      type: object
      required:
      - id
      - name
      - vendor
      - display_name
      - is_enabled
      - health
      - health_details
      - last_successful_run_at
      - consecutive_failures
      - agents_discovered
      - agents_needing_triage
      title: CoverageSourceSummary
    KeywordsConfig:
      properties:
        keywords:
          items:
            type: string
          type: array
          title: Keywords
          description: List of Keywords
      type: object
      required:
