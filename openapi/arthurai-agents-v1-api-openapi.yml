components:
  schemas:
    ToxicityConfig:
      properties:
        threshold:
          type: number
          title: Threshold
          description: 'Optional. Float (0, 1) indicating the level of tolerable toxicity to consider the rule passed or failed. Min: 0 (no toxic language) Max: 1 (very toxic language). Default: 0.5'
          default: 0.5
      additionalProperties: false
      type: object
      title: ToxicityConfig
      example:
        threshold: 0.5
    InternalServerError:
      properties:
        detail:
          type: string
          title: Detail
          default: Internal server error
      type: object
      title: InternalServerError
    AgentCreationSource:
      anyOf:
      - $ref: '#/components/schemas/GCPAgentCreationSource'
      - $ref: '#/components/schemas/OTELAgentCreationSource'
      - $ref: '#/components/schemas/ManualAgentCreationSource'
      title: AgentCreationSource
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LLMModel:
      properties:
        name:
          type: string
          title: Name
          description: Name of the model.
      type: object
      required:
      - name
      title: LLMModel
      description: Model used by an agent.
    KeywordsConfig:
      properties:
        keywords:
          items:
            type: string
          type: array
          title: Keywords
          description: List of Keywords
      type: object
      required:
      - keywords
      title: KeywordsConfig
      example:
        keywords:
        - Blocked_Keyword_1
        - Blocked_Keyword_2
    ManualAgentCreationSource:
      properties:
        type:
          type: string
          const: MANUAL
          title: Type
          default: MANUAL
      type: object
      title: ManualAgentCreationSource
      description: Creation source for manually created tasks.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RuleResponse:
      properties:
        id:
          type: string
          title: Id
          description: ID of the Rule
        name:
          type: string
          title: Name
          description: Name of the Rule
        type:
          $ref: '#/components/schemas/RuleType'
          description: Type of Rule
        apply_to_prompt:
          type: boolean
          title: Apply To Prompt
          description: Rule applies to prompt
        apply_to_response:
          type: boolean
          title: Apply To Response
          description: Rule applies to response
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
          description: Rule is enabled for the task
        scope:
          $ref: '#/components/schemas/RuleScope'
          description: Scope of the rule. The rule can be set at default level or task level.
        created_at:
          type: integer
          title: Created At
          description: Time the rule was created in unix milliseconds
        updated_at:
          type: integer
          title: Updated At
          description: Time the rule was updated in unix milliseconds
        config:
          anyOf:
          - $ref: '#/components/schemas/KeywordsConfig'
          - $ref: '#/components/schemas/RegexConfig'
          - $ref: '#/components/schemas/ExamplesConfig'
          - $ref: '#/components/schemas/ToxicityConfig'
          - $ref: '#/components/schemas/PIIConfig'
          - type: 'null'
          title: Config
          description: Config of the rule
      type: object
      required:
      - id
      - name
      - type
      - apply_to_prompt
      - apply_to_response
      - scope
      - created_at
      - updated_at
      title: RuleResponse
    RuleType:
      type: string
      enum:
      - KeywordRule
      - ModelHallucinationRuleV2
      - ModelSensitiveDataRule
      - PIIDataRule
      - PromptInjectionRule
      - RegexRule
      - ToxicityRule
      title: RuleType
    RuleScope:
      type: string
      enum:
      - default
      - task
      title: RuleScope
    ResourceList_SubAgent_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/SubAgent'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[SubAgent]
    AgentResponse:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp when this agent was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp when this agent was last updated.
        name:
          type: string
          title: Name
          description: Name of the agent.
        data_plane_id:
          type: string
          format: uuid
          title: Data Plane Id
          description: UUID of the data plane where this agent was detected.
        task_id:
          type: string
          format: uuid
          title: Task Id
          description: UUID of the associated task.
        creation_source:
          $ref: '#/components/schemas/AgentCreationSource'
          description: Information about how this agent was created.
        model_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Model Id
          description: Optional UUID of the model spec associated with this agent.
        num_spans:
          type: integer
          title: Num Spans
          description: Number of spans associated with this agent.
          default: 0
        is_autocreated:
          type: boolean
          title: Is Autocreated
          description: Whether this agent was auto-created from traces.
          default: true
        rules:
          items:
            $ref: '#/components/schemas/RuleResponse'
          type: array
          title: Rules
          description: Rules associated with this agent's task.
        last_fetched:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Fetched
          description: Last time traces were fetched for this agent's task.
        muted_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Muted Until
          description: Timestamp until which this agent is muted.
        id:
          type: string
          format: uuid
          title: Id
          description: Agent ID.
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: UUID of the workspace this agent belongs to.
        tools:
          items:
            $ref: '#/components/schemas/ToolResponse'
          type: array
          title: Tools
          description: Tools used by this agent.
        sub_agents:
          items:
            $ref: '#/components/schemas/SubAgentResponse'
          type: array
          title: Sub Agents
          description: Sub-agents used by this agent.
        llm_models:
          items:
            $ref: '#/components/schemas/LLMModelResponse'
          type: array
          title: Llm Models
          description: LLM models used by this agent.
        data_sources:
          items:
            $ref: '#/components/schemas/DataSourceResponse'
          type: array
          title: Data Sources
          description: Data sources used by this agent.
        infrastructure:
          $ref: '#/components/schemas/Infrastructure'
          description: Infrastructure where this agent is running (derived from creation_source).
      type: object
      required:
      - created_at
      - updated_at
      - name
      - data_plane_id
      - task_id
      - creation_source
      - id
      - workspace_id
      - infrastructure
      title: AgentResponse
      description: 'Response model for a registered agent.


        Extends the structure of EnrichedTaskResponse with agent-specific fields

        and database-assigned IDs for nested entities.'
    BadRequestError:
      properties:
        detail:
          type: string
          title: Detail
          default: Bad Request
      type: object
      title: BadRequestError
    PatchUnregisteredAgentRequest:
      properties:
        muted_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Muted Until
          description: Timestamp to mute the agent until. Setting a timestamp in the past will instantly unmute this agent.
      type: object
      title: PatchUnregisteredAgentRequest
      description: Request body for partially updating an unregistered agent.
    AgentSort:
      type: string
      enum:
      - created_at
      - name
      title: AgentSort
    LLMModelResponse:
      properties:
        id:
