          description: Sub-agents used by this agent.
        llm_models:
          items:
            $ref: '#/components/schemas/LLMModelResponse'
          type: array
          title: Llm Models
          description: LLM models used by this agent.
        data_sources:
          items:
            $ref: '#/components/schemas/DataSourceResponse'
          type: array
          title: Data Sources
          description: Data sources used by this agent.
        infrastructure:
          $ref: '#/components/schemas/RunsOn'
          description: Where the machine hosting this agent is, served from `provenance.runs_on`. Typed as RunsOn rather than the data plane's Infrastructure enum because that enum describes how the ENGINE was deployed and cannot say `endpoint` or `unknown` -- so a Jamf record used to report the engine's cloud. Agents with no provenance fall back to their data plane's infrastructure, which is what it has always meant for them.
        mute_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Mute Reason
          description: Why this agent is muted, as given when it was muted. Null when it is not muted, and on mutes that predate the reason being required.
        muted_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Muted By
          description: The user who muted this agent. Null when it is not muted.
        muted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Muted At
          description: When this agent was muted. Null when it is not muted.
        is_stale:
          type: boolean
          title: Is Stale
          description: 'Whether every source reporting this agent has gone quiet. An AND across evidence, not an OR: a record corroborated by a live Splunk query is not stale because a decommissioned Jamf source stopped answering. False for an agent with no evidence, which is every agent predating discovery.'
          default: false
        source_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Source Ids
          description: Discovery sources behind this agent, in evidence order. Backs the inventory's "Found by" column and the source_id filter. Evidence with no configured source behind it -- OTEL, manual, anything predating discovery -- contributes nothing here.
        external_ids:
          items:
            type: string
          type: array
          title: External Ids
          description: The sources' own identifiers for this agent, in evidence order. Canonical identity, never reconciled across sources, so an agent seen by two sources legitimately carries two different values.
        source_classes:
          items:
            $ref: '#/components/schemas/SourceClass'
          type: array
          title: Source Classes
          description: Where this agent has been observed from -- cloud, siem, endpoint, otel or manual -- in evidence order. Backs the "Found by" column and the source_classes filter.
        evidence_level:
          $ref: '#/components/schemas/EvidenceLevel'
          description: 'How much of this agent its sources can see right now: full when a source still reporting sees the whole agent, limited when sources still report but none sees it whole, stale when every source has gone quiet. Rolled up over all evidence, whatever the list is filtered to; backs the evidence_levels filter and the evidence_level sort.'
        first_seen:
          type: string
          format: date-time
          title: First Seen
          description: 'The earliest time any source reported seeing this agent: the earliest evidence first_seen, or the agent''s created_at when no evidence records one. Backs the first_seen sort and the first_seen_after/before filters.'
      type: object
      required:
      - created_at
      - updated_at
      - name
      - data_plane_id
      - task_id
      - id
      - workspace_id
      - creation_source
      - infrastructure
      - evidence_level
      - first_seen
      title: AgentResponse
      description: 'Response model for a registered agent.


        Extends the structure of EnrichedTaskResponse with agent-specific fields

        and database-assigned IDs for nested entities.'
    UnregisteredAgentFilter:
      properties:
        name_filter:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Filter
          description: Filter agents by name (substring match).
        agent_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Agent Ids
          description: Filter agents by agent IDs.
        task_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Task Ids
          description: Filter agents by task IDs.
        sub_agent_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sub Agent Names
          description: Filter agents that use any of these sub-agent names.
        tool_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tool Names
          description: Filter agents that use any of these tool names.
        llm_model_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Llm Model Names
          description: Filter agents that use any of these llm model names.
        data_source_urls:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Data Source Urls
          description: Filter agents that use any of these data source URLs.
        show_muted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Show Muted
          description: True for muted agents only, false for unmuted only, absent for both.
        source_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Source Ids
          description: Filter agents that any discovery source in this list reported.
        data_plane_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Data Plane Ids
          description: Filter agents found by any engine in this list.
        has_source:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Source
          description: True for agents a discovery source reported, false for agents none did. False is combined with source_ids by OR.
        external_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: External Ids
          description: Filter agents by the source's own identifier for them.
        source_classes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SourceClass'
            type: array
          - type: 'null'
          title: Source Classes
          description: Filter agents by where they were observed from -- cloud, siem, endpoint, otel or manual.
        evidence_levels:
          anyOf:
          - items:
              $ref: '#/components/schemas/EvidenceLevel'
            type: array
          - type: 'null'
          title: Evidence Levels
          description: Filter agents by evidence level -- full, limited or stale.
        first_seen_after:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen After
          description: Filter agents a source first saw at or after this time.
        first_seen_before:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen Before
          description: Filter agents a source first saw at or before this time.
        created_after:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created After
          description: Filter agents first reported to Arthur at or after this time.
        created_before:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created Before
          description: Filter agents first reported to Arthur at or before this time.
      type: object
      title: UnregisteredAgentFilter
      description: 'The filters the unregistered agents list takes, as a request body.


        A bulk action given one of these covers exactly the agents a list view with the

        same filters shows, resolved when the action runs.'
    DiscoverySourceHealth:
      type: string
      enum:
      - unknown
      - healthy
      - degraded
      - failed
      title: DiscoverySourceHealth
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OTELAgentCreationSource-Input:
      properties:
        type:
          type: string
          const: OTEL
          title: Type
          default: OTEL
        service_names:
          items:
            type: string
          type: array
          title: Service Names
          description: Service names associated with this agent. Deprecated and will be removed; use observations.service_names. The class is not deprecated, only this flattened accessor.
          deprecated: true
      type: object
      title: OTELAgentCreationSource
      description: 'An agent that instrumented itself; its traces arrived.


        Not a discovery source and not deprecated. There is no upstream system to address.'
    OrganizationBulkUnregisteredAgentsResponse:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/UnregisteredAgentActionResponse'
          type: array
          title: Actions
          description: The audit entries recorded, one per workspace the action changed an agent in. Empty when the action changed nothing.
        affected_count:
          type: integer
          title: Affected Count
          description: How many agents the action changed, across every workspace.
        skipped_agent_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Skipped Agent Ids
          description: 'IDs named in agent_ids that were not acted on: not an unregistered agent in this organization, or, for an unmute, not muted. Empty for an action given a filter.'
      type: object
      required:
      - actions
      - affected_count
      title: OrganizationBulkUnregisteredAgentsResponse
      description: 'What an organization-scoped bulk mute or unmute did.


        The audit trail is kept per workspace, so one organization-wide action leaves one

        entry in each workspace it touched; a workspace''s own action list shows the entry

        whether the action came from the workspace view or the organization view.'
    ResourceList_UnregisteredAgentActionResponse_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/UnregisteredAgentActionResponse'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[UnregisteredAgentActionResponse]
    SubAgent:
      properties:
        name:
          type: string
          title: Name
          description: Name of the sub-agent.
      type: object
      required:
      - name
      title: SubAgent
      description: Sub-agent definition.
    PatchUnregisteredAgentRequest:
      properties:
        muted_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Muted Until
          description: Timestamp to mute the agent until. A timestamp in the past unmutes the agent. Absent, nothing changes.
        mute_reason:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Mute Reason
          description: Why the agent is muted. Recorded on the agent and on the action's audit entry when given; the bulk mute endpoint requires it.
      type: object
      title: PatchUnregisteredAgentRequest
      description: 'Request body for partially updating an unregistered agent.


        The single-agent route the inventory has always called. It does not require a

        reason to mute: the deployed UI sends `muted_until` alone, and requiring one here

        broke every mute from it (UP-5089). The bulk endpoints, which the inventory moves

        to with a reason prompt, are where a reason is required.'
    CloudAgentCreationSource:
      properties:
        vendor:
          type: string
          title: Vendor
          description: 'Upstream product this came from, e.g. ''splunk_enterprise'', ''jamf_pro'', ''aws_bedrock''. FREE TEXT, and deliberately not enumerated here: nothing in this package branches on the vendor -- capability and evidence ceilings are declared per source class -- so enumerating it would make every new vendor a release of this package plus a repin in three services. The registry is app_plane''s discovery source type catalog, which is also where the display name lives. Values are `<platform>_<product>`, always, so a vendor shipping a second product that could be a source does not force a rename of the first.'
        address:
          $ref: '#/components/schemas/SourceAddress'
          description: 'Where to find this agent again upstream. Required: a discovered agent that cannot be located again is not actionable.'
        observations:
          $ref: '#/components/schemas/AgentObservations'
          description: What the source could see. Only fields in `observable_fields()` are ever populated by this category.
        type:
          type: string
          const: CLOUD
          title: Type
          default: CLOUD
      type: object
      required:
      - vendor
      - address
      title: CloudAgentCreationSource
      description: 'An agent read out of a cloud provider''s agent runtime.


        Enumerated rather than searched, so ``address.query`` is absent. Account and region

        are part of the address because scanning is multi-account and multi-region.'
    RegexConfig:
      properties:
        regex_patterns:
          items:
            type: string
          type: array
          title: Regex Patterns
          description: List of Regex patterns to be used for validation. Be sure to encode requests in JSON and account for escape characters.
      additionalProperties: false
      type: object
      required:
      - regex_patterns
      title: RegexConfig
      example:
        regex_patterns:
        - \d{3}-\d{2}-\d{4}
        - \d{5}-\d{6}-\d{7}
    ResourceList_UnregisteredAgentDiscoverySource_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/UnregisteredAgentDiscoverySource'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[UnregisteredAgentDiscoverySource]
    Platform:
      type: string
      enum:
      - darwin
      - linux
      - windows
      title: Platform
      description: 'Which OS the agent runs on.


        A COMPANION TO RunsOn, not a widening of it. ``runs_on`` answers where the machine

        is, this answers which OS it runs. Neither implies the other: a darwin machine can

        be a managed laptop (``runs_on=ENDPOINT``) or an EC2 Mac instance

        (``runs_on=AWS``), and a linux machine can be either a laptop or a cloud VM.


        Enumerated, unlike ``vendor``: this set is bounded and stable, and a typo like

        "macos" for "darwin" would silently break a filter. Vendors are open and growing,

        which is why they are free text.'
    Provenance-Input:
      properties:
        sources:
          items:
            $ref: '#/components/schemas/ProvenanceSource'
          type: array
          minItems: 1
          title: Sources
          description: Every source that has reported this agent, one entry each. Grows as sources corroborate.
        runs_on:
          $ref: '#/components/schemas/RunsOn'
          description: 'Deployment substrate the agent runs on. Scalar, unlike sources: where an agent runs is one fact even when several sources report it, and the more specific answer wins. Defaults to UNKNOWN, which for a SIEM row is usually the honest answer and for a managed laptop is simply correct.'
          default: unknown
        platform:
          anyOf:
          - $ref: '#/components/schemas/Platform'
          - type: 'null'
          description: 'OS the agent runs on, paired with `runs_on` rather than folded into it: neither implies the other, since a darwin machine can be a managed laptop or an EC2 Mac instance. Not endpoint-only -- a SIEM query over host-enriched data can project it, ECS calls it `host.os.platform` with these same values, though a proxy-log query cannot. Absent when the query did not carry it: a column always populated with a guess is worse than one honestly empty.'
      type: object
      required:
      - sources
      title: Provenance
      description: 'Where an agent was found and what it runs on.


        The single source of truth for both: there is no flat ``infrastructure`` enum

        beside it and no standalone ``location`` object. Set on the task at resolution

        time and served through the API intact.'
    ToolResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the tool.
        name:
          type: string
          title: Name
          description: Name of the tool.
        arguments:
          items:
            $ref: '#/components/schemas/ToolArgumentResponse'
          type: array
          title: Arguments
          description: List of arguments for this tool.
      type: object
      required:
      - id
      - name
      title: ToolResponse
      description: Response model for a tool with assigned ID.
    ExamplesConfig:
      properties:
        examples:
          items:
            $ref: '#/components/schemas/ExampleConfig'
          type: array
          title: Examples
          description: List of all the examples for Sensitive Data Rule
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
          description: Optional. Hint added to describe what Sensitive Data Rule should be checking for
      type: object
      required:
      - examples
      title: ExamplesConfig
      example:
        examples:
        - example: John has O negative blood group
          result: true
        - example: Most of the people have A positive blood group
          result: false
        hint: specific individual's blood type
    ResourceList_DataSource_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/DataSource'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[DataSource]
    Visibility:
      type: string
      enum:
      - full
      - limited
      title: Visibility
      description: 'How much of the agent the source can actually see.


        Independent of Detection: a certain detection can carry almost no depth, which is

        the normal case for an endpoint scan, and is exactly the pairing the old single

        band could not express.


        Staleness is NOT a member; it is a separate ``is_stale`` flag on the evidence

        record, so full visibility does not become limited when a credential expires.'
    ToxicityConfig:
      properties:
        threshold:
          type: number
          title: Threshold
          description: 'Optional. Float (0, 1) indicating the level of tolerable toxicity to consider the rule passed or failed. Min: 0 (no toxic language) Max: 1 (very toxic language). Default: 0.5'
          default: 0.5
      additionalProperties: false
      type: object
      title: ToxicityConfig
      example:
        threshold: 0.5
    ResourceList_Tool_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/Tool'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[Tool]
    Agent:
      properties:
        name:
          type: string
          title: Name
          description: Name of the agent.
        data_plane_id:
          type: string
          format: uuid
          title: Data Plane Id
          description: ID of the engine this agent was detected on. Data plane is the legacy API name for an engine.
        task_id:
          type: string
          format: uuid
          title: Task Id
          description: UUID of the associated task.
        provenance:
          anyOf:
          - $ref: '#/components/schemas/Provenance-Input'
          - type: 'null'
          description: Where this agent was found and what it runs on, carried through from the task. The single source of truth for both -- `infrastructure` is served from `provenance.runs_on`, so a Jamf record reports the laptop rather than the cloud hosting the engine that reported it.
        model_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Model Id
          description: Optional UUID of the model spec associated with this agent.
        num_spans:
          type: integer
          title: Num Spans
          description: Number of spans associated with this agent.
          default: 0
        is_autocreated:
          type: boolean
          title: Is Autocreated
          description: Whether this agent was auto-created from traces.
          default: true
        rules:
          items:
            $ref: '#/components/schemas/RuleResponse'
          type: array
          title: Rules
          description: Rules associated with this agent's task.
        last_fetched:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Fetched
          description: Last time traces were fetched for this agent's task.
        muted_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Muted Until
          description: Timestamp until which this agent is muted.
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Evidence
          description: 'Every source''s report of this agent, one record each. A list rather than the singular creation_source it replaces: two sources disagree about how much they can see, when they last looked and whether they are still reporting, and flattening them would make one of those answers win arbitrarily. Merged per source on upsert rather than replaced, so a fetch job scoped to one discovery source cannot wipe another source''s evidence.'
        creation_source:
          anyOf:
          - $ref: '#/components/schemas/AgentCreationSource'
          - type: 'null'
          description: 'DEPRECATED -- use `evidence`. Retained so publishers that predate the evidence model keep working: on write it is wrapped into a single evidence record, and on read it is served from the agent''s primary evidence record.'
          deprecated: true
        tools:
          items:
            $ref: '#/components/schemas/Tool'
          type: array
          title: Tools
          description: Tools used by this agent.
        sub_agents:
          items:
            $ref: '#/components/schemas/SubAgent'
          type: array
          title: Sub Agents
          description: Sub-agents used by this agent.
        llm_models:
          items:
            $ref: '#/components/schemas/LLMModel'
          type: array
          title: Llm Models
          description: LLM models used by this agent.
        data_sources:
          items:
            $ref: '#/components/schemas/DataSource'
          type: array
          title: Data Sources
          description: Data sources used by this agent.
      type: object
      required:
      - name
      - data_plane_id
      - task_id
      title: Agent
      description: Request model for agent upsert - nested entities without IDs.
    LLMModelResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the LLM model entry.
        name:
          type: string
          title: Name
          description: Name of the LLM model.
      type: object
      required:
      - id
      - name
      title: LLMModelResponse
      description: Response model for an LLM model with assigned ID.
    EvidenceLevel:
      type: string
      enum:
      - full
      - limited
      - stale
      title: EvidenceLevel
      description: 'How much of an agent its sources can see right now, as one word.


        Rolled up over every evidence record, whatever a list is filtered to: `full` when

        a source that is still reporting sees the whole agent, `limited` when sources are

        still reporting but none sees it whole, `stale` when every source has gone quiet.

        An agent with no evidence at all reads as limited, not stale -- nothing has gone

        quiet, which is what `is_stale` says too. Ordered strongest first, which is what a

        sort on it means.'
    Evidence:
      properties:
        creation_source:
          $ref: '#/components/schemas/AgentCreationSource'
          description: The reporting source, its upstream address and what it observed.
        external_id:
          type: string
          title: External Id
          description: The source's own identifier for this agent, and the canonical identity for the record. Never re-derived or reconciled across sources -- whatever the source returned is what it is.
        visibility:
          $ref: '#/components/schemas/Visibility'
          description: How much of the agent this source can see. Computed server-side from which fields it could actually fill -- see the source class's ``observable_fields()`` and ``visibility_ceiling()`` -- never a UI heuristic.
        last_seen:
          type: string
          format: date-time
          title: Last Seen
          description: When the evidence itself was observed.
        last_scanned:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Scanned
          description: 'When this source was last read successfully FOR THIS RECORD. Separate from `last_seen` because they fail separately, and per-record because a fleet pull returns records of wildly differing freshness -- Jamf''s own reportDate is per device for the same reason, so a run-level timestamp cannot answer ''when did we last actually see this device''. Staleness is derived from this rather than stored: see the class docstring.'
        first_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen
          description: 'The earliest time this source reported seeing it: the earliest `last_seen` the source has reported. Derived by the Platform as reports arrive and never moved forward; a value sent in a request is ignored. Per-source rather than per-agent: a record can be new to a Splunk source and months old to the endpoint one.'
        discovered_in_run:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Discovered In Run
          description: 'The scan run that produced this evidence. Meant to be what ''new this scan'' derives from -- there is deliberately no ''new'' status field to fall out of date. `first_seen` cannot serve for it: it is the source''s own sighting, which can predate the scan that first reported the record.'
        source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Id
          description: The Discovery Source behind this evidence. Per-record because two sources of the same vendor can both report one agent.
      type: object
      required:
      - creation_source
      - external_id
      - visibility
      - last_seen
      title: Evidence
      description: 'One source''s report of one agent.


        An agent can hold SEVERAL of these, from different sources, which is why evidence

        is a record rather than a set of fields on the agent: two sources disagree about how

        much they know, when they last looked, and whether they are still reporting, and

        flattening them would force one of those answers to win arbitrarily.


        Deliberately not one score. ``detection`` says how the agent was found and is

        derived from the creation source, since the source class fixes it. ``visibility``

        says how much of it can be seen and is stored, because it depends on what actually

        arrived. ``last_scanned`` says when the source was last read for this record.


        THERE IS NO STORED ``is_stale``. Staleness is a function of ``last_scanned``, a

        threshold, and the current time, so a stored flag would be wrong the moment time

        passed without a write, and would need a sweeper job that exists only because the

        flag is stored. The threshold is also not this package''s to hold: stale for a Jamf

        fleet reporting daily is not stale for a SIEM query running hourly, and the source

        config carries the schedule and lookback that decide it. app_plane derives it and

        serves it in the response, so it stays out of the UI -- the same principle as

        visibility.'
  securitySchemes:
    OAuth2AuthorizationCode:
      type: oauth2
      flows:
        authorizationCode:
