    SIEMAgentCreationSource:
      properties:
        vendor:
          type: string
          title: Vendor
          description: 'Upstream product this came from, e.g. ''splunk_enterprise'', ''jamf_pro'', ''aws_bedrock''. FREE TEXT, and deliberately not enumerated here: nothing in this package branches on the vendor -- capability and evidence ceilings are declared per source class -- so enumerating it would make every new vendor a release of this package plus a repin in three services. The registry is app_plane''s discovery source type catalog, which is also where the display name lives. Values are `<platform>_<product>`, always, so a vendor shipping a second product that could be a source does not force a rename of the first.'
        address:
          $ref: '#/components/schemas/SourceAddress'
          description: 'Where to find this agent again upstream. Required: a discovered agent that cannot be located again is not actionable.'
        observations:
          $ref: '#/components/schemas/AgentObservations'
          description: What the source could see. Only fields in `observable_fields()` are ever populated by this category.
        type:
          type: string
          const: SIEM
          title: Type
          default: SIEM
      type: object
      required:
      - vendor
      - address
      title: SIEMAgentCreationSource
      description: 'An agent surfaced by a query against the customer''s security stack.


        One variant for all three SIEMs, discriminated by ``siem``: the payload is

        identical in every case and only the query language differs, which belongs to the

        connector that runs the query.


        HOW MUCH IT OBSERVES DEPENDS ON WHAT THE CUSTOMER INDEXES, not on the vendor. A

        query over proxy or DNS logs sees a destination and little else, which is what

        every v1 example query does. One over host-enriched data can carry the OS and the

        cloud -- ECS has ``host.os.platform``, ``host.os.version`` and ``cloud.provider``;

        Sentinel''s Heartbeat table has ``OSName`` and ``ComputerEnvironment``. Since the

        customer''s own query controls the output columns, either is reachable.


        OBSERVABLE_FIELDS below is therefore a ceiling in the fullest sense: it says what a

        SIEM query *can* project, and most will project almost none of it.'
