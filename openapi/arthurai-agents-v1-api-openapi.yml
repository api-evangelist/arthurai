    EndpointAgentCreationSource:
      properties:
        vendor:
          type: string
          title: Vendor
          description: 'Upstream product this came from, e.g. ''splunk_enterprise'', ''jamf_pro'', ''aws_bedrock''. FREE TEXT, and deliberately not enumerated here: nothing in this package branches on the vendor -- capability and evidence ceilings are declared per source class -- so enumerating it would make every new vendor a release of this package plus a repin in three services. The registry is app_plane''s discovery source type catalog, which is also where the display name lives. Values are `<platform>_<product>`, always, so a vendor shipping a second product that could be a source does not force a rename of the first.'
        address:
          $ref: '#/components/schemas/SourceAddress'
          description: 'Where to find this agent again upstream. Required: a discovered agent that cannot be located again is not actionable.'
        observations:
          $ref: '#/components/schemas/AgentObservations'
          description: What the source could see. Only fields in `observable_fields()` are ever populated by this category.
        type:
          type: string
          const: ENDPOINT
          title: Type
          default: ENDPOINT
      type: object
      required:
      - vendor
      - address
      title: EndpointAgentCreationSource
      description: 'One agent observed on one managed endpoint.


        Grain is per (software, device): ``address.instance`` is the device and

        ``address.resource_id`` the software, because the Discovery list shows a row per

        machine.


        What it fills comes from three places: the collector''s on-disk output, the MDM''s

        device record, and the collector''s catalog.


        Where the collector''s six output columns land, so none is unaccounted for:


        ========  =============================================

        column    carried as

        ========  =============================================

        kind      ``address.resource_kind``

        id        ``address.resource_id``

        ver       ``observations.version``

        loc       ``observations.install_path``

        perms     ``observations.permissions``

        extra     nothing -- see below

        ========  =============================================


        ``extra`` means a different thing per kind (browser type, image size, deb arch,

        unit state, listening address) and a field here means one thing for every source.

        The listening address is the one value in it worth its own field eventually.


        ``scan`` rows must never arrive: that kind marks a branch that could not look, not

        an agent that was found.


        A one-shot scan sees the machine, not behaviour over time. Anything needing

        persistent event capture -- outbound destinations, connection counts -- is out of

        reach until osqueryd runs with the audit subsystem, which would put code signing,

        notarization and PPPC on the critical path.'
    PutAgents:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/Agent'
          type: array
          title: Agents
          description: List of agents to create or update.
      type: object
      required:
      - agents
      title: PutAgents
      description: 'Request body for creating or updating agents.


        EACH AGENT IS VALIDATED ON ITS OWN. A body is refused only if it is not a list

        of agents at all; an agent that fails validation is set aside with its errors,

        and the rest are stored. Validating the list as a whole meant one bad task kept

        every unregistered agent off the Platform (UP-5069). Done in a wrap validator so

        the request schema, and every client generated from it, is unchanged.'
    SourceClass:
      type: string
      enum:
      - cloud
      - siem
      - endpoint
      - otel
      - manual
      title: SourceClass
      description: 'Where a source observes from. One name for this concept everywhere.


        The design docs'' "source class"; earlier API drafts called it ``vantage_point``.

        Used on a configured discovery source and on a task''s provenance alike, so the two

        are the same vocabulary rather than two that have to be reconciled.


        Consumers branch on this -- capability and evidence ceilings are declared per class

        -- which is why it is a closed enum while the vendor is not.'
