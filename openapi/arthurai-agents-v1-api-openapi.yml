openapi: 3.2.0
info:
  title: Arthur Scope Agents V1 API
  version: 0.1.0
tags:
- name: Agents V1
paths:
  /api/v1/organization/unregistered_agents:
    get:
      tags:
      - Agents V1
      summary: List Organization Unregistered Agents
      description: 'Lists all unregistered agents across every workspace in the organization. Gate-only: unregistered agents have no model to evaluate, so the org permission gate is the entire access boundary. Requires organization_list_unregistered_agents permission.'
      operationId: list_unregistered_agents_for_organization
      security:
      - OAuth2AuthorizationCode:
        - organization_list_unregistered_agents
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AgentSort'
          description: The field to sort the agents by.
          default: created_at
        description: The field to sort the agents by.
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: The order to sort the agents by.
          default: desc
        description: The order to sort the agents by.
      - name: name_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter agents by name.
          title: Name Filter
        description: Filter agents by name.
      - name: agent_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter agents by agent IDs.
          title: Agent Ids
        description: Filter agents by agent IDs.
      - name: task_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter agents by task IDs.
          title: Task Ids
        description: Filter agents by task IDs.
      - name: sub_agent_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter agents that use any of these sub-agent names.
          title: Sub Agent Names
        description: Filter agents that use any of these sub-agent names.
      - name: tool_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter agents that use any of these tool names.
          title: Tool Names
        description: Filter agents that use any of these tool names.
      - name: llm_model_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter agents that use any of these llm model names.
          title: Llm Model Names
        description: Filter agents that use any of these llm model names.
      - name: data_source_urls
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter agents that use any of these data source URLs.
          title: Data Source Urls
        description: Filter agents that use any of these data source URLs.
      - name: show_muted
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter agents that are muted.
          title: Show Muted
        description: Filter agents that are muted.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      - name: source_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter agents that any discovery source in this list reported.
          title: Source Ids
        description: Filter agents that any discovery source in this list reported.
      - name: data_plane_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter agents found by any engine in this list.
          title: Data Plane Ids
        description: Filter agents found by any engine in this list.
      - name: has_source
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'True for agents at least one discovery source reported, false for agents no discovery source reported. Sent with source_ids, false is combined with source_ids by OR rather than AND: agents with no source plus agents any of those sources reported.'
          title: Has Source
        description: 'True for agents at least one discovery source reported, false for agents no discovery source reported. Sent with source_ids, false is combined with source_ids by OR rather than AND: agents with no source plus agents any of those sources reported.'
      - name: external_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Filter agents by the source''s own identifier for them. Canonical identity: never re-derived or reconciled across sources.'
          title: External Ids
        description: 'Filter agents by the source''s own identifier for them. Canonical identity: never re-derived or reconciled across sources.'
      - name: source_classes
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/SourceClass'
          - type: 'null'
          description: Filter agents by where they were observed from -- cloud, siem, endpoint, otel or manual.
          title: Source Classes
        description: Filter agents by where they were observed from -- cloud, siem, endpoint, otel or manual.
      - name: evidence_levels
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/EvidenceLevel'
          - type: 'null'
          description: Filter agents by evidence level -- full, limited or stale -- as rolled up over all their evidence.
          title: Evidence Levels
        description: Filter agents by evidence level -- full, limited or stale -- as rolled up over all their evidence.
      - name: first_seen_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter agents a source first saw at or after this time. An agent's first_seen is its earliest evidence first_seen, or its created_at. On the source's clock, so not what 'new this scan' means; see created_after.
          title: First Seen After
        description: Filter agents a source first saw at or after this time. An agent's first_seen is its earliest evidence first_seen, or its created_at. On the source's clock, so not what 'new this scan' means; see created_after.
      - name: first_seen_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter agents a source first saw at or before this time.
          title: First Seen Before
        description: Filter agents a source first saw at or before this time.
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Filter agents first reported to Arthur at or after this time: the agent''s created_at, set when it is first uploaded and never changed. ''New this scan'' is created_after the scan''s start.'
          title: Created After
        description: 'Filter agents first reported to Arthur at or after this time: the agent''s created_at, set when it is first uploaded and never changed. ''New this scan'' is created_after the scan''s start.'
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter agents first reported to Arthur at or before this time.
          title: Created Before
        description: Filter agents first reported to Arthur at or before this time.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_AgentResponse_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organization/unregistered_agents/summary:
    get:
      tags:
      - Agents V1
      summary: Summarize Organization Unregistered Agents
      description: 'Fleet-scale totals for the unregistered agents across every workspace in the organization, independent of pagination: the coverage hero counts, the coverage-by-class grid with each source''s health and agent counts, and the blind spots. Requires organization_list_unregistered_agents permission; sources and source-derived blind spots are included only when the caller can also list the organization''s discovery sources.'
      operationId: get_unregistered_agents_summary_for_organization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnregisteredAgentsSummary'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - OAuth2AuthorizationCode:
        - organization_list_unregistered_agents
  /api/v1/organization/unregistered_agents/engines:
    get:
      tags:
      - Agents V1
      summary: List The Engines Behind The Organization'S Unregistered Agents
      description: 'The engines that found at least one unregistered agent in any workspace of the organization, with each engine''s workspace, for the list''s engine filter. Requires organization_list_unregistered_agents and organization_list_data_planes permission: the options name the engines, which the list itself does not.'
      operationId: list_unregistered_agent_engines_for_organization
      security:
      - OAuth2AuthorizationCode:
        - organization_list_unregistered_agents
        - organization_list_data_planes
      parameters:
      - name: show_muted
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Only engines of muted agents when true, of unmuted agents when false, of all agents when absent.
          title: Show Muted
        description: Only engines of muted agents when true, of unmuted agents when false, of all agents when absent.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_UnregisteredAgentEngine_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organization/unregistered_agents/discovery_sources:
    get:
      tags:
      - Agents V1
      summary: List The Discovery Sources Behind The Organization'S Unregistered Agents
      description: 'The discovery sources that reported at least one unregistered agent in any workspace of the organization, deleted sources included, for the list''s source filter. Requires organization_list_unregistered_agents and organization_list_discovery_sources permission: the options name the sources, which the summary withholds from a caller who cannot list them.'
      operationId: list_unregistered_agent_discovery_sources_for_organization
      security:
      - OAuth2AuthorizationCode:
        - organization_list_unregistered_agents
        - organization_list_discovery_sources
      parameters:
      - name: show_muted
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Only sources of muted agents when true, of unmuted agents when false, of all agents when absent.
          title: Show Muted
        description: Only sources of muted agents when true, of unmuted agents when false, of all agents when absent.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_UnregisteredAgentDiscoverySource_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organization/unregistered_agents/mute:
    post:
      tags:
      - Agents V1
      summary: Mute Organization Unregistered Agents
      description: Mute unregistered agents across every workspace in the organization, named by id or by the filters the organization list shows, until a timestamp and for a reason. The selection resolves when the action runs. The audit trail is per workspace, so the one action leaves one entry in each workspace it changed an agent in. Requires unregistered_agent_patch permission on the organization.
      operationId: mute_unregistered_agents_for_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteUnregisteredAgentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBulkUnregisteredAgentsResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCode: []
  /api/v1/organization/unregistered_agents/unmute:
    post:
      tags:
      - Agents V1
      summary: Unmute Organization Unregistered Agents
      description: Unmute unregistered agents across every workspace in the organization, named by id or by the filters the organization list shows. Agents that are not muted are left as they are and reported as skipped. The audit trail is per workspace, so the one action leaves one entry in each workspace it lifted a mute in. Requires unregistered_agent_patch permission on the organization.
      operationId: unmute_unregistered_agents_for_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnmuteUnregisteredAgentsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBulkUnregisteredAgentsResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCode: []
  /api/v1/organization/agent_llm_models:
    get:
      tags:
      - Agents V1
      summary: List Organization Agent Llm Models
      description: Lists all registered agent LLM models across every workspace in the organization, filtered to agents whose models the caller can read. Requires organization_list_agent_llm_models permission.
      operationId: list_agent_llm_models_for_organization
      security:
      - OAuth2AuthorizationCode:
        - organization_list_agent_llm_models
      parameters:
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: The order to sort the llm models by.
          default: desc
        description: The order to sort the llm models by.
      - name: name_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter llm models by name.
          title: Name Filter
        description: Filter llm models by name.
      - name: agent_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter llm models by their associated agent names.
          title: Agent Names
        description: Filter llm models by their associated agent names.
      - name: agent_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter llm models by their associated agent IDs.
          title: Agent Ids
        description: Filter llm models by their associated agent IDs.
      - name: model_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter llm models by any model IDs their associated agents are attached to.
          title: Model Ids
        description: Filter llm models by any model IDs their associated agents are attached to.
      - name: task_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter llm models on their associated task IDs.
          title: Task Ids
        description: Filter llm models on their associated task IDs.
      - name: tool_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter llm models on their associated tool names.
          title: Tool Names
        description: Filter llm models on their associated tool names.
      - name: sub_agent_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter llm models on agents containing any of these sub-agent names.
          title: Sub Agent Names
        description: Filter llm models on agents containing any of these sub-agent names.
      - name: data_source_urls
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter llm models on agents containing any of these data source URLs.
          title: Data Source Urls
        description: Filter llm models on agents containing any of these data source URLs.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_LLMModel_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organization/agent_tools:
    get:
      tags:
      - Agents V1
      summary: List Organization Agent Tools
      description: Lists all registered agent tools across every workspace in the organization, filtered to agents whose models the caller can read. Requires organization_list_agent_tools permission.
      operationId: list_agent_tools_for_organization
      security:
      - OAuth2AuthorizationCode:
        - organization_list_agent_tools
      parameters:
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: The order to sort the tools by.
          default: desc
        description: The order to sort the tools by.
      - name: name_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter tools by name.
          title: Name Filter
        description: Filter tools by name.
      - name: agent_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter tools by their associated agent names.
          title: Agent Names
        description: Filter tools by their associated agent names.
      - name: agent_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter tools by their associated agent IDs.
          title: Agent Ids
        description: Filter tools by their associated agent IDs.
      - name: model_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter tools by any model IDs their associated agents use.
          title: Model Ids
        description: Filter tools by any model IDs their associated agents use.
      - name: task_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filter tools on their associated task IDs.
          title: Task Ids
        description: Filter tools on their associated task IDs.
      - name: sub_agent_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter tools on agents containing these sub-agent names.
          title: Sub Agent Names
        description: Filter tools on agents containing these sub-agent names.
      - name: llm_model_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter tools on agents containing these llm model names.
          title: Llm Model Names
        description: Filter tools on agents containing these llm model names.
      - name: data_source_urls
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter tools on agents containing these data source URLs.
          title: Data Source Urls
        description: Filter tools on agents containing these data source URLs.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_Tool_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/registered/{agent_id}:
    get:
      tags:
      - Agents V1
      summary: Get A Registered Agent By Its Id
      description: Get a single registered agent by ID. Requires agent_read permission.
      operationId: get_registered_agent_by_id
      security:
      - OAuth2AuthorizationCode:
        - agent_read
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/unregistered/{agent_id}:
    patch:
      tags:
      - Agents V1
      summary: Update An Unregistered Agent
      description: 'Update an unregistered agent: mute it, with a reason, or unmute it. Either is recorded as an action on the workspace. Requires unregistered_agent_patch permission.'
      operationId: update_unregistered_agent
      security:
      - OAuth2AuthorizationCode:
        - unregistered_agent_patch
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
