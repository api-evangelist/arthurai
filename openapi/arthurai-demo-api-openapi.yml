openapi: 3.1.0
info:
  title: Arthur GenAI Engine Agent Discovery Demo API
  version: 2.1.688
tags:
- name: Demo
paths:
  /api/v2/demo/certificate:
    post:
      tags:
      - Demo
      summary: Upload Certificate
      description: Upload a demo completion certificate PNG to persistent storage.
      operationId: upload_certificate_api_v2_demo_certificate_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_certificate_api_v2_demo_certificate_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/demo/certificate/{cert_id}:
    get:
      tags:
      - Demo
      summary: Get Certificate
      description: Retrieve a previously stored demo completion certificate PNG.
      operationId: get_certificate_api_v2_demo_certificate__cert_id__get
      parameters:
      - name: cert_id
        in: path
        required: true
        schema:
          type: string
          title: Cert Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CertificateUploadResponse:
      properties:
        certificate_id:
          type: string
          title: Certificate Id
        certificate_url:
          type: string
          title: Certificate Url
      type: object
      required:
      - certificate_id
      - certificate_url
      title: CertificateUploadResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_upload_certificate_api_v2_demo_certificate_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_certificate_api_v2_demo_certificate_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    API Key:
      type: http
      description: Bearer token authentication with an API key
      scheme: bearer
