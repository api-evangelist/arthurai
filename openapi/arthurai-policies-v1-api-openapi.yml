    get:
      tags:
      - Policies V1
      summary: List Assignment Attestations
      description: Lists attestation history for a policy assignment. Requires policy_assignment_list_attestations permission.
      operationId: list_assignment_attestations
      security:
      - OAuth2AuthorizationCode:
        - policy_assignment_list_attestations
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Assignment Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
