          type: string
          const: test_discovery_source
          title: Job Type
          default: test_discovery_source
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: The ID of the workspace the engine belongs to.
        data_plane_id:
          type: string
          format: uuid
          title: Data Plane Id
          description: The ID of the engine to test from.
        discovery_source_config_id:
          type: string
          format: uuid
          title: Discovery Source Config Id
          description: ID of the discovery source config under test.
        discovery_source_config:
          $ref: '#/components/schemas/DiscoverySourceConfigSpec'
          description: The config as it read when the test was requested. Never contains credentials - the engine fetches those live from the Platform.
        lookback_hours:
          type: integer
          title: Lookback Hours
          description: The config's lookback window, rounded up to whole hours, exactly as a scan of the same config would use it.
        test_id:
          type: string
          format: uuid
          title: Test Id
          description: Groups the per-engine jobs one test request fanned out.
        preview_limit:
          type: integer
          title: Preview Limit
          description: The most rows the engine reads and reports. The engine stops consuming the source once it has this many.
      type: object
      required:
      - workspace_id
      - data_plane_id
      - discovery_source_config_id
      - discovery_source_config
      - lookback_hours
      - test_id
      - preview_limit
      title: TestDiscoverySourceJobSpec
      description: 'Runs one bounded preview of a discovery source config on one engine (D-12).


        A sibling of the scan job rather than a flag on it, because a test must never

        reach the paths a scan exists for: it publishes nothing to GenAI Engine, chains

        no fetch, and writes no Discovery Run. What it produces is a preview the engine

        reports back against this job''s attempt, read through the test that fanned it

        out.


        The config is snapshotted exactly as a scan snapshots it, so the engine runs

        the query the user saw when they pressed the button. Credentials are absent

        for the same reason they are absent from a scan: the engine fetches them live.'
