        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/policy_assignments/{assignment_id}/compliance_status:
    put:
      tags:
      - Policies V1
      summary: Set Compliance Status
      description: Sets the compliance status for a policy assignment. Called by the data-plane compliance check executor. Requires policy_assignment_set_compliance_status permission.
      operationId: set_compliance_status
      security:
      - OAuth2AuthorizationCode:
        - policy_assignment_set_compliance_status
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Assignment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetComplianceStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignment'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/policy_assignments/{assignment_id}/job_chain:
    patch:
      tags:
      - Policies V1
      summary: Update Assignment Job Chain
      description: Sparse update for the downstream job IDs in the compliance chain (alerts_check_job_id, compliance_job_id). Called by the data-plane executors as the chain advances. metrics_calc_job_id is set by the operator at chain submission and is not accepted here. Requires policy_assignment_set_compliance_status permission.
      operationId: update_assignment_job_chain
      security:
      - OAuth2AuthorizationCode:
        - policy_assignment_set_compliance_status
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Assignment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAssignmentJobChainPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignmentDetail'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
