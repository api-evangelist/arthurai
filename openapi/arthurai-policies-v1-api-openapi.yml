          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
          description: ISO 8601 timestamp when the job finished or null if not finished yet.
        duration_sec:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Sec
          description: Duration of the job in seconds or null if not finished yet.
        error_count:
