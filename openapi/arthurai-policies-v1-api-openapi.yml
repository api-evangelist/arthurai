          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    JobTrigger:
      type: string
      enum:
      - user
      - schedule
      - event
      title: JobTrigger
    ResourceList_PolicyAlertRule_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/PolicyAlertRule'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[PolicyAlertRule]
    PolicyAssignmentDetail:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time of record creation.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Time of last record update.
        id:
          type: string
          format: uuid
          title: Id
          description: The ID of the policy assignment.
        policy:
          $ref: '#/components/schemas/Policy'
          description: Full policy details.
        model:
          $ref: '#/components/schemas/ModelSummary'
          description: Summary of the assigned model.
        applied_at:
          type: string
          format: date-time
          title: Applied At
          description: When the policy was applied to the model.
        applied_by_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Applied By User Id
          description: The ID of the user who applied the policy.
        enforcement_starts_at:
          type: string
          format: date-time
          title: Enforcement Starts At
          description: When enforcement starts.
        compliance_status:
          $ref: '#/components/schemas/ComplianceStatusDetail'
          description: Current compliance status.
        metrics_calc_job:
          anyOf:
          - $ref: '#/components/schemas/Job'
          - type: 'null'
          description: Metrics calculation job at the head of the compliance chain, or null if no chain has run yet.
        alerts_check_job:
          anyOf:
          - $ref: '#/components/schemas/Job'
          - type: 'null'
          description: Alert check job in the middle of the compliance chain, or null if the chain has not advanced past metrics calculation.
        compliance_job:
          anyOf:
          - $ref: '#/components/schemas/Job'
          - type: 'null'
          description: Compliance policy check job at the tail of the chain, or null if the chain has not yet enqueued compliance evaluation.
        last_violation_notified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Violation Notified At
          description: When the last non-compliance webhook was fired for this assignment.
      type: object
      required:
      - created_at
      - updated_at
      - id
      - policy
      - model
      - applied_at
      - enforcement_starts_at
      - compliance_status
      title: PolicyAssignmentDetail
    ComplianceRow:
      properties:
        assignment_id:
          type: string
          format: uuid
          title: Assignment Id
          description: The policy-model assignment ID.
        rule_type:
          $ref: '#/components/schemas/ComplianceRuleType'
          description: Whether this is an alert rule or attestation rule.
        rule:
          $ref: '#/components/schemas/ComplianceRuleSummary'
          description: The rule.
        model:
          $ref: '#/components/schemas/ComplianceModelSummary'
          description: The assigned model.
        policy:
          $ref: '#/components/schemas/CompliancePolicySummary'
          description: The policy.
        compliance_status:
          $ref: '#/components/schemas/ComplianceStatus'
          description: 'Rule-level compliance status: ''COMPLIANT'' or ''NON_COMPLIANT''.'
        approved_by:
          anyOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
          description: The user who last attested (attestation rules only).
        next_due:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Due
          description: 'When the next check is due. For attestation rules: next attestation due date. For alert rules: next compliance job run (tomorrow). Null when the rule is deleted.'
        frequency_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frequency Days
          description: Attestation validity period in days (attestation rules only).
        alert:
          anyOf:
          - $ref: '#/components/schemas/ComplianceAlertSummary'
          - type: 'null'
          description: The triggering alert (non-compliant alert rules only).
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: The error message that caused the violation when no triggering alert exists (e.g. missing guardrail).
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: When this compliance evaluation was recorded.
      type: object
      required:
      - assignment_id
      - rule_type
      - rule
      - model
      - policy
      - compliance_status
      title: ComplianceRow
    Job:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: UUID of the job.
        kind:
          $ref: '#/components/schemas/JobKind'
          description: Type of job.
        job_spec:
          anyOf:
          - $ref: '#/components/schemas/FetchDataJobSpec'
          - $ref: '#/components/schemas/MetricsCalculationJobSpec'
          - $ref: '#/components/schemas/SchemaInspectionJobSpec'
          - $ref: '#/components/schemas/ConnectorCheckJobSpec'
          - $ref: '#/components/schemas/ListDatasetsJobSpec'
          - $ref: '#/components/schemas/ScheduleJobsJobSpec'
          - $ref: '#/components/schemas/AlertCheckJobSpec'
          - $ref: '#/components/schemas/CreateModelTaskJobSpec'
          - $ref: '#/components/schemas/UpdateModelTaskRulesJobSpec'
          - $ref: '#/components/schemas/DeleteModelTaskJobSpec'
          - $ref: '#/components/schemas/FetchModelTaskJobSpec'
          - $ref: '#/components/schemas/RegenerateTaskValidationKeyJobSpec'
          - $ref: '#/components/schemas/CreateModelLinkTaskJobSpec'
          - $ref: '#/components/schemas/TestCustomAggregationJobSpec'
          - $ref: '#/components/schemas/DiscoverAgentsJobSpec'
          - $ref: '#/components/schemas/CompliancePolicyCheckJobSpec'
          - $ref: '#/components/schemas/FetchDiscoveredAgentsJobSpec'
          - $ref: '#/components/schemas/TestDiscoverySourceJobSpec'
          title: Job Spec
          description: Job specification for the job kind.
        state:
          $ref: '#/components/schemas/JobState'
          description: Current state of the job.
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: ID of parent project.
        data_plane_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Data Plane Id
          description: UUID of the data plane that executed the job or null if not picked up by data plane yet.
        queued_at:
          type: string
          format: date-time
          title: Queued At
          description: ISO 8601 timestamp when the job was queued.
        ready_at:
          type: string
          format: date-time
          title: Ready At
          description: ISO 8601 timestamp of the earliest time the job can be executed.
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
          description: ISO 8601 timestamp when the job started or null if not started yet.
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
          description: ISO 8601 timestamp when the job finished or null if not finished yet.
        duration_sec:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Sec
          description: Duration of the job in seconds or null if not finished yet.
        error_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Error Count
          description: Count of errors the job flagged or null if not finished yet.
        trigger_type:
          $ref: '#/components/schemas/JobTrigger'
          description: Type of trigger.
        triggered_by_user:
          anyOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
          description: User object that triggered the job, null if trigger_type is not 'user'.
        schedule_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Schedule Id
          description: ID of the schedule this job should follow.
        attempts:
          type: integer
          title: Attempts
          description: Number of times the job was attempted.
        max_attempts:
          type: integer
          title: Max Attempts
          description: Max number of times the job can fail and be retried.
        nonce:
          anyOf:
          - type: string
          - type: 'null'
          title: Nonce
          description: Optional job nonce for ensuring exactly once execution.
        memory_requirements_mb:
          type: integer
          title: Memory Requirements Mb
          description: Memory requirements for the job in megabytes.
        job_priority:
          $ref: '#/components/schemas/JobPriority'
          description: Priority of the job.
      type: object
      required:
      - id
      - kind
      - job_spec
      - state
      - project_id
      - queued_at
      - ready_at
      - trigger_type
      - attempts
      - max_attempts
      - memory_requirements_mb
      - job_priority
      title: Job
    CompliantAlertRuleStatus:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The ID of the alert rule.
        name:
          type: string
          title: Name
          description: The name of the alert rule.
      type: object
      required:
      - id
      - name
      title: CompliantAlertRuleStatus
    PatchPolicy:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: The name of the policy.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: The description of the policy.
        owner_group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Group Id
          description: The ID of the group that owns this policy.
        webhook_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Webhook Id
          description: The ID of the notification webhook.
        enforcement_delay_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Enforcement Delay Days
          description: The number of days for the enforcement delay.
      type: object
      title: PatchPolicy
    JobKind:
      type: string
      enum:
      - metrics_calculation
      - connector_check
      - list_datasets
      - schema_inspection
      - fetch_data
      - alert_check
      - schedule_jobs
      - create_model_task
      - create_model_link_task
      - update_model_task_rules
      - delete_model_task
      - fetch_model_task
      - regenerate_task_validation_key
      - test_custom_aggregation
      - discover_agents
      - compliance_policy_check
      - fetch_discovered_agents
      - test_discovery_source
      title: JobKind
    PolicyAlertGuardrailRule:
      properties:
        resource_type:
          type: string
          const: guardrail
          title: Resource Type
          default: guardrail
        resource_name:
          $ref: '#/components/schemas/RuleType'
      type: object
      required:
      - resource_name
      title: PolicyAlertGuardrailRule
    PolicyAssignmentListWithOutsideCount:
      properties:
        records:
          items:
            $ref: '#/components/schemas/PolicyAssignment'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
        outside_view_count:
          type: integer
          title: Outside View Count
          description: Number of this policy's assignments whose application is outside the caller's view. A count only - never the names, identifiers, workspaces or statuses of those applications. Independent of the listing's filters.
          default: 0
      type: object
      required:
      - records
      - pagination
      title: PolicyAssignmentListWithOutsideCount
    UserType:
      type: string
      enum:
      - user
      - data_plane
      - service_account
      title: UserType
    ResourcePermissions:
      properties:
        can_update:
          type: boolean
          title: Can Update
          description: Whether the requesting principal may update this resource.
        can_delete:
          type: boolean
          title: Can Delete
          description: Whether the requesting principal may delete this resource.
      type: object
      required:
      - can_update
      - can_delete
      title: ResourcePermissions
      description: Capability flags for the requesting principal on a single resource.
    GCPAgentMetadata:
      properties:
        project_id:
          type: string
          title: Project Id
          description: Project ID of the agent.
        region:
          type: string
          title: Region
          description: Region of the agent.
        resource_id:
          type: string
          title: Resource Id
          description: Resource ID of the agent.
      type: object
      required:
      - project_id
      - region
      - resource_id
      title: GCPAgentMetadata
    PostAttestationRecord:
      properties:
        attestation_rule_id:
          type: string
          format: uuid
          title: Attestation Rule Id
          description: The ID of the attestation rule this attestation satisfies.
        notes:
          type: string
          title: Notes
          description: Notes from the reviewer.
      type: object
      required:
      - attestation_rule_id
      - notes
      title: PostAttestationRecord
    JobState:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      - cancelled
      title: JobState
    ExampleConfig:
      properties:
        example:
          type: string
          title: Example
          description: Custom example for the sensitive data
        result:
          type: boolean
          title: Result
          description: 'Boolean value representing if the example passes or fails the the sensitive data rule '
      type: object
      required:
      - example
      - result
      title: ExampleConfig
      example:
        example: John has O negative blood group
        result: true
    PatchPolicyAttestationRule:
      properties:
        name:
          anyOf:
