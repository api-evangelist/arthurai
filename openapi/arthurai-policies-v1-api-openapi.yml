    DiscoverySourceConfigSpec:
      properties:
        discovery_source_id:
          type: string
          format: uuid
          title: Discovery Source Id
          description: ID of the discovery source the config belongs to.
        name:
          type: string
          title: Name
          description: Name of the config, for logs and run reporting.
        vendor:
          type: string
          title: Vendor
          description: Vendor of the parent discovery source, e.g. splunk_enterprise.
        query:
          type: string
          title: Query
          description: Query text in the vendor's native language, stored and sent verbatim.
        query_language:
          type: string
          title: Query Language
          description: Language the query text is written in.
        lookback_window_seconds:
          type: integer
          title: Lookback Window Seconds
          description: The config's lookback window, in seconds. lookback_hours carries the same window rounded up to whole hours for the engine's window API.
        source_fields:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Source Fields
          description: The discovery source's non-sensitive fields, keyed by field name, as they read at dispatch - e.g. the vendor endpoint to connect to. Never contains a sensitive field. Null on jobs dispatched before sources were snapshotted.
      type: object
      required:
      - discovery_source_id
      - name
      - vendor
      - query
      - query_language
      - lookback_window_seconds
      title: DiscoverySourceConfigSpec
      description: 'One discovery source config, materialized into a scan job at dispatch.


        The scheduler snapshots the config into the job rather than handing the

        engine an ID to resolve, so a job describes the work it was created for even

        after the config is edited or deleted, and so a run stays reproducible: the

        query text here is the query that ran.


        Credentials are deliberately absent. The engine fetches those live from the

        Platform over an authenticated API at execution time (D-05) - a job payload

        is persisted, logged and listed, and a secret has no business in one. The

        source''s non-sensitive fields - where to connect, not how to authenticate -

        are snapshotted with the config, because an engine cannot read the discovery

        source itself: that takes an organization-level role, and an engine''s

        account is bound to its workspace.'
