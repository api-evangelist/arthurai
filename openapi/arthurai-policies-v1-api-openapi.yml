          - type: 'null'
          description: The user who last attested (attestation rules only).
        next_due:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Due
          description: 'When the next check is due. For attestation rules: next attestation due date. For alert rules: next compliance job run (tomorrow).'
        frequency_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frequency Days
          description: Attestation validity period in days (attestation rules only).
        alert:
          anyOf:
          - $ref: '#/components/schemas/ComplianceAlertSummary'
          - type: 'null'
          description: The triggering alert (non-compliant alert rules only).
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: The error message that caused the violation when no triggering alert exists (e.g. missing guardrail).
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: When this compliance evaluation was recorded.
      type: object
      required:
      - assignment_id
      - rule_type
      - rule
      - model
      - policy
      - compliance_status
