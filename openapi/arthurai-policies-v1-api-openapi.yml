    FetchDiscoveredAgentsJobSpec:
      properties:
        job_type:
          type: string
          const: fetch_discovered_agents
          title: Job Type
          default: fetch_discovered_agents
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: The ID of the workspace the engine belongs to.
        data_plane_id:
          type: string
          format: uuid
          title: Data Plane Id
          description: The ID of the engine whose GenAI Engine holds the tasks.
        discovery_source_id:
          type: string
          format: uuid
          title: Discovery Source Id
          description: ID of the discovery source whose tasks to fetch.
        reported_since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reported Since
          description: Only fetch tasks the source reported on or after this time. Null fetches every task the source has ever reported, which is what the standalone schedule does so it reconciles tasks no recent scan touched.
        scan_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Scan Id
          description: The manual scan whose leg chained this fetch, so the scan reads as complete only once the agents it found have reached the Platform. Null on standalone fetches, on fetches chained by scheduled scans, and on fetches from engines that predate it.
      type: object
      required:
      - workspace_id
      - data_plane_id
      - discovery_source_id
      title: FetchDiscoveredAgentsJobSpec
      description: 'Surfaces one discovery source''s tasks on one engine to the Agents API (D-10).


        Scoped to a source rather than to a config or a scan, because there is no DAG

        runner: a job cannot wait on the N scan jobs that touched a source, so each scan

        chains its own fetch and a standalone schedule catches whatever none of them did.

        Scoped to an engine because the tasks live in that engine''s GenAI Engine.'
