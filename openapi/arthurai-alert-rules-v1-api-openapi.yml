openapi: 3.2.0
info:
  title: Arthur Scope Alert Rules V1 API
  version: 0.1.0
tags:
- name: Alert Rules V1
paths:
  /api/v1/models/{model_id}/alert_rules:
    get:
      tags:
      - Alert Rules V1
      summary: Get Model Alert Rules
      description: Returns a list of alert rules associated with a model. Requires model_list_alert_rules permission.
      operationId: get_model_alert_rules
      security:
      - OAuth2AuthorizationCode:
        - model_list_alert_rules
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AlertRuleSort'
          description: The field to sort by.
          default: created_at
        description: The field to sort by.
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: The order to sort by.
          default: desc
        description: The order to sort by.
      - name: name
        in: query
        required: false
        schema:
          type: string
          description: The name of the alert rule to search by.
          title: Name
        description: The name of the alert rule to search by.
      - name: bound
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AlertBound'
          description: The bound to filter by.
        description: The bound to filter by.
      - name: query
        in: query
        required: false
        schema:
          type: string
          description: The query to filter by.
          title: Query
        description: The query to filter by.
      - name: threshold_less_than
        in: query
        required: false
        schema:
          type: number
          description: The threshold to filter by, less than.
          title: Threshold Less Than
        description: The threshold to filter by, less than.
      - name: threshold_greater_than
        in: query
        required: false
        schema:
          type: number
          description: The threshold to filter by, greater than.
          title: Threshold Greater Than
        description: The threshold to filter by, greater than.
      - name: metric_name
        in: query
        required: false
        schema:
          type: string
          description: The name of the alert rule query metric to search by.
          title: Metric Name
        description: The name of the alert rule query metric to search by.
      - name: policy_model_assignment_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          description: Optional policy model assignment ID to filter alert rules by.
          title: Policy Model Assignment Id
        description: Optional policy model assignment ID to filter alert rules by.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_AlertRule_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Alert Rules V1
      summary: Create Model Alert Rule
      description: Creates an alert rule. Requires model_create_alert_rule permission.
      operationId: post_model_alert_rule
      security:
      - OAuth2AuthorizationCode:
        - model_create_alert_rule
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAlertRule'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/{model_id}/alert_rules/timeline:
    get:
      tags:
      - Alert Rules V1
      summary: Get Model Alert Rules Timeline
      description: Returns per-alert-rule health streaks computed from alert rule evaluation logs over a time range, with a default of the last 7 days. Time not covered by any evaluation is returned as 'not_evaluated'. Requires model_list_alerts permission.
      operationId: get_model_alert_rules_timeline
      security:
      - OAuth2AuthorizationCode:
        - model_list_alerts
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      - name: start_time
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: Start of the timeline range (inclusive). Defaults to 7 days before end_time if not specified.
          title: Start Time
        description: Start of the timeline range (inclusive). Defaults to 7 days before end_time if not specified.
      - name: end_time
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: End of the timeline range (exclusive). Must be after start_time. Defaults to now if not specified.
          title: End Time
        description: End of the timeline range (exclusive). Must be after start_time. Defaults to now if not specified.
      - name: resolution
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum number of streak segments per alert rule. Streak boundary precision is at worst (end_time - start_time) / resolution and never coarser than the rule's own evaluation interval.
          default: 500
          title: Resolution
        description: Maximum number of streak segments per alert rule. Streak boundary precision is at worst (end_time - start_time) / resolution and never coarser than the rule's own evaluation interval.
      - name: alert_rule_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          description: Optional alert rule IDs to filter by.
          title: Alert Rule Ids
        description: Optional alert rule IDs to filter by.
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AlertRuleSort'
          description: The field to sort by.
          default: name
        description: The field to sort by.
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: The order to sort by.
          default: asc
        description: The order to sort by.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleTimelineList'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/{model_id}/alert_rule_query_validation:
    post:
      tags:
      - Alert Rules V1
      summary: Validate A Model Alert Rule Query
      description: Validates an alert rule query. Requires model_create_alert_rule permission.
      operationId: post_alert_rule_query_validation
      security:
      - OAuth2AuthorizationCode:
        - model_create_alert_rule
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateAlertRuleQueryReq'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleSQLValidationResp'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces/{workspace_id}/alert_rules:
    get:
      tags:
      - Alert Rules V1
      summary: Get Workspace Alert Rules
      description: Returns alert rules across all models in the workspace, including rules attached indirectly via policy assignments. Applies the caller's per-model RBAC. Requires workspace_list_alert_rules permission.
      operationId: get_alert_rules_in_workspace
      security:
      - OAuth2AuthorizationCode:
        - workspace_list_alert_rules
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AlertRuleSort'
          description: The field to sort by.
          default: created_at
        description: The field to sort by.
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: The order to sort by.
          default: desc
        description: The order to sort by.
      - name: model_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          description: Optional filter to alert rules of a single model.
          title: Model Id
        description: Optional filter to alert rules of a single model.
      - name: name
        in: query
        required: false
        schema:
          type: string
          description: The name of the alert rule to search by.
          title: Name
        description: The name of the alert rule to search by.
      - name: bound
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AlertBound'
          description: The bound to filter by.
        description: The bound to filter by.
      - name: query
        in: query
        required: false
        schema:
          type: string
          description: The query to filter by.
          title: Query
        description: The query to filter by.
      - name: threshold_less_than
        in: query
        required: false
        schema:
          type: number
          description: The threshold to filter by, less than.
          title: Threshold Less Than
        description: The threshold to filter by, less than.
      - name: threshold_greater_than
        in: query
        required: false
        schema:
          type: number
          description: The threshold to filter by, greater than.
          title: Threshold Greater Than
        description: The threshold to filter by, greater than.
      - name: metric_name
        in: query
        required: false
        schema:
          type: string
          description: The name of the alert rule query metric to search by.
          title: Metric Name
        description: The name of the alert rule query metric to search by.
      - name: policy_model_assignment_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          description: Optional policy model assignment ID to filter alert rules by.
          title: Policy Model Assignment Id
        description: Optional policy model assignment ID to filter alert rules by.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: The page to return starting from 1 up to total_pages.
          default: 1
          title: Page
        description: The page to return starting from 1 up to total_pages.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: The number of records per page. The max is 1000.
          default: 20
          title: Page Size
        description: The number of records per page. The max is 1000.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_AlertRule_'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alert_rules/validate_query:
    post:
      tags:
      - Alert Rules V1
      summary: Validate An Alert Rule Query (Static)
      description: Performs static validation of an alert rule SQL query without requiring a model. Checks syntax, allowed tables, allowed functions, clause restrictions, and template presence. Does not execute the query.
      operationId: post_alert_rule_query_validation_static
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateAlertRuleQueryReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleSQLValidationResp'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCode: []
  /api/v1/alert_rules/{alert_rule_id}:
    get:
      tags:
      - Alert Rules V1
      summary: Get Alert Rule By Id
      description: Returns a single alert rule by ID. Requires alert_rule_read permission.
      operationId: get_alert_rule
      security:
      - OAuth2AuthorizationCode:
        - alert_rule_read
      parameters:
      - name: alert_rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Alert Rules V1
      summary: Update Model Alert Rule
      description: Updates an alert rule. Requires alert_rule_update permission.
      operationId: patch_alert_rule
      security:
      - OAuth2AuthorizationCode:
        - alert_rule_update
      parameters:
      - name: alert_rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAlertRule'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Alert Rules V1
      summary: Delete Alert Rule By Id
      description: Deletes a single alert rule by ID. Requires alert_rule_delete permission.
      operationId: delete_alert_rule
      security:
      - OAuth2AuthorizationCode:
        - alert_rule_delete
      parameters:
      - name: alert_rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Rule Id
      responses:
        '204':
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AlertRuleTimelineStatus:
      type: string
      enum:
      - fired
      - okay
      - no_data
      - not_evaluated
      title: AlertRuleTimelineStatus
    AlertRule:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time of record creation.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Time of last record update.
        id:
          type: string
          format: uuid
          title: Id
          description: The id of the alert rule.
        model_id:
          type: string
          format: uuid
          title: Model Id
          description: The model id of the alert rule.
        name:
          type: string
          title: Name
          description: The name of the alert rule.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: The description of the alert rule.
        threshold:
          type: number
          title: Threshold
          description: The threshold that will trigger the alert rule.
        bound:
          $ref: '#/components/schemas/AlertBound'
          description: The bound of the alert rule.
        query:
          type: string
          title: Query
          description: The query of the alert rule.
        metric_name:
          type: string
          title: Metric Name
          description: The name of the metric returned by the alert rule query.
        interval:
          $ref: '#/components/schemas/AlertRuleInterval'
          description: The interval of the alert rule, commonly '1 day', '1 hour', etc.
        last_updated_by_user:
          anyOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
          description: Information for user who last updated the alert rule.
        notification_webhooks:
          items:
            $ref: '#/components/schemas/AlertRuleNotificationWebhook'
          type: array
          title: Notification Webhooks
          description: Notification webhooks configured for the alert rule.
        policy_alert_rule_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Policy Alert Rule Id
          description: The ID of the policy alert rule this alert rule was created from, or null if not policy-managed.
        policy_model_assignment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Policy Model Assignment Id
          description: The ID of the policy model assignment this alert rule belongs to, or null if not policy-managed.
      type: object
      required:
      - created_at
      - updated_at
      - id
      - model_id
      - name
      - threshold
      - bound
      - query
      - metric_name
      - interval
      - notification_webhooks
      title: AlertRule
    Pagination:
      properties:
        page:
          type: integer
          title: Page
          description: The current page number. Page 1 is the first page.
          default: 1
        page_size:
          type: integer
          title: Page Size
          description: Number of records per page.
          default: 20
        total_pages:
          type: integer
          title: Total Pages
          description: Total number of pages.
        total_records:
          type: integer
          title: Total Records
          description: Total number of records across all pages.
      type: object
      required:
      - total_pages
      - total_records
      title: Pagination
    NotFoundError:
      properties:
        detail:
          type: string
          title: Detail
          default: Resource not found
      type: object
      title: NotFoundError
    IntervalUnit:
      type: string
      enum:
      - seconds
      - minutes
      - hours
      - days
      title: IntervalUnit
    UserType:
      type: string
      enum:
      - user
      - data_plane
      - service_account
      title: UserType
    AlertRuleTimelineList:
      properties:
        records:
          items:
            $ref: '#/components/schemas/AlertRuleTimeline'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
        start_time:
          type: string
          format: date-time
          title: Start Time
          description: Start of the timeline range (inclusive).
        end_time:
          type: string
          format: date-time
          title: End Time
          description: End of the timeline range (exclusive).
        resolution:
          type: integer
          title: Resolution
          description: Maximum number of streak segments per alert rule the timeline was computed with.
      type: object
      required:
      - records
      - pagination
      - start_time
      - end_time
      - resolution
      title: AlertRuleTimelineList
    ValidateAlertRuleQueryReq:
      properties:
        query:
          type: string
          title: Query
          description: The query of the alert rule.
      type: object
      required:
      - query
      title: ValidateAlertRuleQueryReq
    AlertBound:
      type: string
      enum:
      - upper_bound
      - lower_bound
      title: AlertBound
    AlertRuleTimelineTotals:
      properties:
        fired:
          type: integer
          title: Fired
          description: Number of evaluations overlapping the requested range that fired an alert.
        okay:
          type: integer
          title: Okay
          description: Number of evaluations overlapping the requested range that stayed within the threshold.
        no_data:
          type: integer
          title: No Data
          description: Number of evaluations overlapping the requested range that found no metric data.
      type: object
      required:
      - fired
      - okay
      - no_data
      title: AlertRuleTimelineTotals
    ResourceList_AlertRule_:
      properties:
        records:
          items:
            $ref: '#/components/schemas/AlertRule'
          type: array
          title: Records
          description: List of records.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination information.
      type: object
      required:
      - records
      - pagination
      title: ResourceList[AlertRule]
    AlertRuleTimeline:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The id of the alert rule.
        name:
          type: string
          title: Name
          description: The name of the alert rule.
        metric_name:
          type: string
          title: Metric Name
          description: The name of the metric returned by the alert rule query.
        bound:
          $ref: '#/components/schemas/AlertBound'
          description: The bound of the alert rule.
        threshold:
          type: number
          title: Threshold
          description: The threshold that will trigger the alert rule.
        interval:
          $ref: '#/components/schemas/AlertRuleInterval'
          description: The interval of the alert rule, commonly '1 day', '1 hour', etc.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time the alert rule was created.
        first_log_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Log At
          description: Timestamp of the earliest evaluation log ever recorded for the alert rule, or null if the rule has never been evaluated.
        totals:
          $ref: '#/components/schemas/AlertRuleTimelineTotals'
          description: Evaluation counts by status over the requested range.
        streaks:
          items:
