        required: false
        schema:
          $ref: '#/components/schemas/TraceSortBy'
          description: Column to sort results by.
          default: start_time
        description: Column to sort results by.
      - name: include_spans
        in: query
        required: false
        schema:
          type: boolean
          description: Include flat list of spans for each trace. Defaults to false for performance.
          default: false
          title: Include Spans
        description: Include flat list of spans for each trace. Defaults to false for performance.
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaginationSortMethod'
          description: Sort the results (asc/desc)
          default: desc
        description: Sort the results (asc/desc)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Page size. Default is 10. Must be greater than 0 and less than 5000.
          default: 10
