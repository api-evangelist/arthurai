        in: query
        required: false
        schema:
          type: string
          description: Return only results with this tool name.
          title: Tool Name
        description: Return only results with this tool name.
      - name: span_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Span types to filter on. Optional. Valid values: AGENT, CHAIN, EMBEDDING, EVALUATOR, GUARDRAIL, LLM, PROMPT, RERANKER, RETRIEVER, TOOL, UNKNOWN'
          title: Span Types
        description: 'Span types to filter on. Optional. Valid values: AGENT, CHAIN, EMBEDDING, EVALUATOR, GUARDRAIL, LLM, PROMPT, RERANKER, RETRIEVER, TOOL, UNKNOWN'
